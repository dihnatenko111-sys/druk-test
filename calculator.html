<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Широкоформатний друк</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header><div class="top">
  <div class="logo"><i></i>НазваДрук</div>
  <nav class="menu" id="menu"></nav>
</div></header>

<main class="wrap" id="app"></main>

<footer><div class="wrap">
  <div><b>© 2026 НазваДрук</b><br><a style="color:#a5b4fc" data-go="page/offer">Публічна оферта</a> / <a style="color:#a5b4fc" data-go="page/terms">Умови використання</a></div>
  <div><b>Режим роботи</b>
    <table><tr><td></td><td>офіс</td><td>склад</td></tr>
      <tr><td>Понеділок – П'ятниця</td><td>9:00 — 19:30</td><td>9:00 — 18:00</td></tr>
      <tr><td>Субота</td><td>9:30 — 17:30</td><td>9:00 — 18:00</td></tr></table>
    <div style="margin-top:8px">Автоматичний прийом та виготовлення замовлень — 24/7</div></div>
  <div><div class="tel">0 800 00-00-00</div>+380 (00) 000-00-00<br>+380 (00) 000-00-00</div>
</div></footer>

<aside class="drawer" id="drawer"></aside>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script src="shared.js"></script>
<script>
/* =====================================================================
   РЕНДЕР
   ===================================================================== */
const $=s=>document.querySelector(s);
const app=$('#app');

const crumbs=extra=>`<div class="crumbs"><a data-go="">Оформлення нового замовлення</a><span>/</span>${extra?`<a data-go="">Широкоформатний друк</a><span>/</span>${extra}`:'Широкоформатний друк'}</div>
  <div class="tabs"><a>Продукти</a><a class="on" data-go="">Широкоформатний друк</a><a title="Обране">☆</a></div>`;

function renderHome(){
  app.innerHTML=crumbs()+`<div class="tiles">${ORDER.map(id=>{const c=CATS[id];return `<a class="tile" data-go="${id}"><div class="ico">${I[c.ico]}</div><b>${c.n}</b><span>${c.d}</span></a>`}).join('')}</div>`;
}
function infoBlock(){
  const L=[['doc','Інструкція по оформленню замовлення'],['printer','Якість друку'],['layers','Матеріали'],['chat','Ваш відгук'],['clock','Терміни друку'],['width','Ширина матеріалів та друку'],['tag','Зразки матеріалів з друком'],['warn','Знайшли помилку?']];
  return `<div class="card"><div class="info">${L.map(([i,t])=>`<a data-info="${t}">${I[i]}<span>${t}</span></a>`).join('')}</div></div>`;
}
function renderCustom(){
  app.innerHTML=crumbs('Індивідуальне замовлення')+`<div class="card title-card"><h1>Індивідуальне замовлення</h1></div>
   <div class="card"><p style="margin-top:0;color:var(--muted)">Опишіть завдання — менеджер прорахує комплексне або нестандартне замовлення.</p>
   <div class="card-h"><h2>Форма замовлення</h2></div>
   <div class="form"><div><div class="lbl">Ім'я</div><input class="inp"></div><div><div class="lbl">Телефон</div><input class="inp" type="tel"></div>
   <div><div class="lbl">Опишіть ваше завдання із зазначенням тиражів, технологій, термінів та всього, що допоможе нам максимально підготуватися до розмови з вами</div><textarea></textarea></div>
   <div><button class="btn">Завантажити файл</button></div><div><button class="btn pri" data-toast="Тестова версія: заявка не надсилається">Надіслати</button></div></div></div>`;
}
function renderProduct(){
  const c=curCat();
  let h=crumbs(c.n)+`<div class="card title-card"><h1>${c.n}</h1></div>`+infoBlock();
  if(c.vids) h+=`<div class="card"><div class="card-h"><h2>Вид</h2></div><div class="vids">${c.vids.map((v,i)=>`<div class="vid ${i===S.vid?'on':''}" data-vid="${i}">${VIDS[v.ico]}${v.n}</div>`).join('')}</div></div>`;
  h+=`<div class="card" id="sizeCard"></div>`;
  if(c.opts.length) h+=`<div class="card" id="optCard"></div>`;
  if(c.kind!=='stand') h+=`<div class="card"><div class="kits"><h2>Комплектів</h2><div class="stepper"><button data-k="-1">−</button><input id="kits" type="number" min="1" value="${S.kits}"><button data-k="1">+</button></div><small>Замовлень з однаковими параметрами, але <b>різними макетами</b></small></div></div>`;
  h+=`<div class="card" id="filterCard"></div><div class="card price" id="priceCard"></div>
      <p class="foot-note">* кінцева вартість виробу може бути змінена після оформлення замовлення у випадку незручного розміру для комплектування</p>`;
  app.innerHTML=h;
  renderSize(); renderOpts(); renderFilter(); renderPrice();
}

function renderSize(){
  const c=curCat(), list=stdList();
  const stdOpts=list.map((s,i)=>`<option value="${i}" ${i===S.std?'selected':''}>${s[0]} × ${s[1]} мм${c.kind==='stand'?` (${fmt(s[2])} грн)${s[3]?' — '+s[3]:''}`:(s[2]?` (${s[2]})`:'')}</option>`).join('');
  let left=`<div class="lbl">Оберіть стандартний:</div><select class="sel" id="stdSel">${stdOpts}</select>`;
  if(c.kind==='stand'){
    left+=`<div class="stand-modes">${['Конструкція + друк банера','Друк банера без конструкції','Конструкція без друку'].map((t,i)=>`<label class="radio"><input type="radio" name="sm" value="${i}" ${i===S.standMode?'checked':''}>${t}</label>`).join('')}</div>`;
  } else {
    const rows=S.sizes.length?S.sizes:[{w:'',h:''}];
    left+=`<div class="lbl" style="margin-top:16px">Введіть свій:</div>`+rows.map((r,i)=>`
      <div class="own" data-i="${i}"><input class="inp" data-k="w" placeholder="Ширина" type="number" min="0" value="${r.w}"><span class="x">×</span><input class="inp" data-k="h" placeholder="Висота" type="number" min="0" value="${r.h}">
      ${i===0?`<select class="sel" id="unit"><option value="mm" ${S.unit==='mm'?'selected':''}>мм</option><option value="cm" ${S.unit==='cm'?'selected':''}>см</option></select>`:'<span></span>'}
      ${i>0?`<button class="rm" data-rm="${i}" title="Видалити">×</button>`:'<span></span>'}</div>`).join('')+
      `<button class="btn" id="addSize" style="margin-top:8px">Додати ще один розмір</button>`;
  }
  $('#sizeCard').innerHTML=`<div class="card-h"><h2>Розмір</h2></div><div class="size-grid"><div>${left}</div><div><div class="pv-h">Вигляд готового виробу</div><div class="pv" id="pv"></div></div></div>`;
  renderPreview();
}

function renderPreview(){
  const c=curCat(), sizes=curSizes(), o=S.opts; const pv=$('#pv'); if(!pv) return;
  if(!sizes.length){ pv.innerHTML='<span style="color:var(--muted)">Вкажіть розмір</span>'; return; }
  const show=sizes.slice(0,4), box=show.length>1?140:210;
  pv.innerHTML=show.map(s=>{
    const k=box/Math.max(s.w,s.h), w=Math.max(18,s.w*k), h=Math.max(18,s.h*k), pad=10;
    let g=`<rect x="${pad}" y="${pad}" width="${w}" height="${h}" rx="2" fill="var(--card)" stroke="var(--ink)" stroke-opacity=".35"/>`;
    if(c.kind==='stand'){ const v=c.vids[S.vid].ico;
      if(v==='x') g+=`<path d="M${pad} ${pad}L${pad-8} ${pad+h+16}M${pad+w} ${pad}L${pad+w+8} ${pad+h+16}" stroke="var(--muted)"/>`;
      if(v==='roll') g+=`<rect x="${pad-4}" y="${pad+h}" width="${w+8}" height="6" rx="2" fill="var(--muted)"/>`;
      if(v==='wall') g+=`<path d="M${pad} ${pad+h}v14M${pad+w} ${pad+h}v14" stroke="var(--muted)"/>`;
      if(v==='clip') g+=`<rect x="${pad-3}" y="${pad-3}" width="${w+6}" height="6" fill="var(--muted)"/><rect x="${pad-3}" y="${pad+h-3}" width="${w+6}" height="6" fill="var(--muted)"/>`; }
    if(S.cat==='canvas'&&S.vid===0) g+=`<rect x="${pad+5}" y="${pad+5}" width="${w-10}" height="${h-10}" fill="none" stroke="var(--accent)" stroke-dasharray="3 3"/>`;
    if(S.cat==='banner'){
      const pc=OPT.pocket.c[o.pocket||0]; const t=7;
      if(pc.sides) for(const sd of pc.sides) g+=sd==='t'?`<rect x="${pad}" y="${pad}" width="${w}" height="${t}" fill="var(--accent)" opacity=".25"/>`:sd==='b'?`<rect x="${pad}" y="${pad+h-t}" width="${w}" height="${t}" fill="var(--accent)" opacity=".25"/>`:sd==='l'?`<rect x="${pad}" y="${pad}" width="${t}" height="${h}" fill="var(--accent)" opacity=".25"/>`:`<rect x="${pad+w-t}" y="${pad}" width="${t}" height="${h}" fill="var(--accent)" opacity=".25"/>`;
      const ey=OPT.eyel.c[o.eyel||0];
      if(ey.pos){ const st=OPT.eyelStep.c[o.eyelStep??4].step, pts=[], P=(x,y)=>pts.push([pad+4+x*(w-8),pad+4+y*(h-8)]);
        const line=(n,f)=>{for(let i=0;i<n;i++) f(i/(n-1));};
        const nW=Math.min(24,Math.max(2,Math.ceil(s.w/st)+1)), nH=Math.min(24,Math.max(2,Math.ceil(s.h/st)+1)), p=ey.pos;
        if(p==='c4'){P(0,0);P(1,0);P(0,1);P(1,1);}
        else if(p==='c8'){[[0,0],[.5,0],[1,0],[0,.5],[1,.5],[0,1],[.5,1],[1,1]].forEach(([x,y])=>P(x,y));}
        else { if(p==='trbl'||p.includes('t')) line(nW,t=>P(t,0)); if(p==='trbl'||p.includes('b')) line(nW,t=>P(t,1)); if(p==='trbl'||p.includes('l')) line(nH,t=>P(0,t)); if(p==='trbl'||p.includes('r')) line(nH,t=>P(1,t)); }
        g+=pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.2" fill="none" stroke="var(--ink)" stroke-opacity=".6"/>`).join(''); }
    }
    return `<div style="text-align:center"><svg width="${w+2*pad+16}" height="${h+2*pad+18}" viewBox="-8 0 ${w+2*pad+16} ${h+2*pad+18}">${g}</svg>
      <div style="font-size:13px">${fmt1(s.w*10)} x ${fmt1(s.h*10)} мм<br><b>(${fmt1(s.w*s.h/1e4)} м²)</b></div></div>`;
  }).join('')+(sizes.length>4?`<div style="color:var(--muted)">+ ще ${sizes.length-4}</div>`:'');
}

function optHint(def,ch){
  const s=curSizes()[0]; if(!s||!ch) return '';
  const per=2*(s.w+s.h)/100;
  if(def.id==='eyelDia'){ const ey=OPT.eyel.c[S.opts.eyel||0]; if(!ey.pos) return ''; const n=eyeletCount(s,ey.pos,OPT.eyelStep.c[S.opts.eyelStep??4].step); return `+ ${fmt(ch.ep)} x ${n} = ${fmt(ch.ep*n)} грн`; }
  if(ch.k) return '';
  if(!ch.per) return '';
  const minT=ch.min?` (мінімум ${fmt1(ch.min)} грн)`:'';
  switch(ch.per){
    case 'piece': return `+ ${fmt(ch.p)} грн/виріб${minT}`;
    case 'perim': return `+ ${fmt(ch.p*per)} грн/шт${minT}`;
    case 'perimCm': return `+ ${fmt1(ch.p)} x ${fmt1(per*100)} = ${fmt(ch.p*per*100)} грн`;
    case 'perimTh': return `+ ${fmt(1.98*(ch.x||1))} - ${fmt(7.92*(ch.x||1))} грн/шт, залежить від товщини матеріалу${minT}`;
    case 'area': return `+ ${fmt(ch.p*s.w*s.h/1e4)} грн/шт`;
    case 'pocket': return `+ ${fmt(ch.p*[...ch.sides].reduce((t,sd)=>t+((sd==='t'||sd==='b')?s.w:s.h),0)/100)} грн/шт`;
  } return '';
}

function renderOpts(){
  const c=curCat(); if(!$('#optCard')) return;
  const o=S.opts;
  let h=`<div class="card-h"><h2>Опції</h2><button class="ghost" id="optClear">✕ Очистити</button></div>`;
  for(const id of c.opts){
    const def=OPT[id]; if(def.when&&!def.when(o,S)) continue;
    const val=o[def.id]??def.def??0; let ctl='';
    if(def.t==='select') ctl=`<select class="sel" data-o="${def.id}">${def.c.map((ch,i)=>`<option value="${i}" ${i===val?'selected':''}>${ch.l}</option>`).join('')}</select>`;
    else if(def.t==='chips') ctl=`<div class="chips">${def.c.map((ch,i)=>`<div class="chip ${i===val?'on':''}" data-o="${def.id}" data-v="${i}">${ch.l==='Ні'?I.no:''}${ch.l}</div>`).join('')}</div>`;
    else if(def.t==='plotlen'){ const p=S.plotLen;
      ctl=`<div style="display:grid;gap:8px">
        <label class="radio"><input type="radio" name="pl" value="0" ${p.mode===0?'checked':''}>Я знаю довжину: <input class="inline-in" data-pl="len" type="number" value="${p.len}"> мм</label>
        <label class="radio"><input type="radio" name="pl" value="1" ${p.mode===1?'checked':''}>Визначити приблизно: <input class="inline-in" data-pl="obj" type="number" value="${p.obj}"> <small style="color:var(--muted)">кількість об'єктів в макеті * ціна може бути перерахована</small></label>
        <label class="radio"><input type="radio" name="pl" value="2" ${p.mode===2?'checked':''}>Вирахувати при перевірці</label></div>`; }
    const hint=def.c?optHint(def,def.c[val]):'';
    h+=`<div class="opt ${def.sub?'sub':''}"><div class="ol">${def.l}${def.note?`<div style="font-size:11.5px;color:var(--muted);font-weight:400">${def.note}</div>`:''}</div><div class="ctl">${ctl}${hint?`<span class="hint">${hint}</span>`:''}</div></div>`;
  }
  if(isBigItem()){
    const v=o.big||0;
    const ch=c.big==='weld'?['Зпаювання +24 грн м/пог (вертикальне по вужчій стороні) (+ 1 день до терміну друку)','Віддати частинами']:['Віддати частинами'];
    h+=`<div class="opt"><div class="ol">Великий розмір<div style="font-size:11.5px;color:var(--muted);font-weight:400">Виріб ширший за друк — друкується частинами</div></div><div class="ctl"><div class="chips">${ch.map((t,i)=>`<div class="chip ${i===v?'on':''}" data-o="big" data-v="${i}">${t}</div>`).join('')}</div></div></div>`;
  }
  $('#optCard').innerHTML=h;
}

function renderFilter(){
  const c=curCat(), f=S.f;
  const selMats=[...f.mats].map(i=>c.mats[i]);
  const qAvail=k=>(selMats.length?selMats:c.mats.filter(m=>!m.na)).some(m=>m.pr[k]!=null);
  const mAvail=m=>!m.na&&(!f.q.size||[...f.q].some(k=>m.pr[k]!=null));
  const qLab=(c.qLabel||'Якість друку');
  let h=`<div class="card-h"><h2>Фільтр (вибір, порівняння)</h2><button class="ghost" id="fReset">Скинути</button></div>`;
  if(c.mats.length>1) h+=`<div class="frow"><div class="fname ${f.mats.size&&f.mats.size===c.mats.filter(m=>!m.na).length?'on':''}" data-all="mats">${f.mats.size?'Обрати всі<br>матеріали':'Матеріал'}</div><div class="fbtns">${c.mats.map((m,i)=>`<button class="fb ${f.mats.has(i)?'on':''} ${mAvail(m)?'':'dis'}" data-f="mats" data-v="${i}" data-tip="${esc(m.t)}${m.na?'\nНемає в наявності':''}">${m.n}${m.na?'<span class="na">немає в наявності</span>':''}</button>`).join('')}</div></div>`;
  if(c.lam) h+=`<div class="frow"><div class="fname" data-all="lam">Ламінація</div><div class="fbtns">${c.lam.map((l,i)=>`<button class="fb ${f.lam.has(i)?'on':''}" data-f="lam" data-v="${i}" data-tip="${esc(l.t)}">${l.n}</button>`).join('')}</div></div>`;
  h+=`<div class="frow"><div class="fname" data-all="q">${f.q.size?'Обрати всі<br>типи друку':qLab}</div><div class="fbtns">${c.q.map(k=>`<button class="fb ${f.q.has(k)?'on':''} ${qAvail(k)?'':'dis'}" data-f="q" data-v="${k}" data-tip="${esc(Q[k].t)}">${Q[k].n}</button>`).join('')}</div></div>`;
  if(S.termsOn) h+=`<div class="frow"><div class="fname ${f.terms.size?'':'on'}" data-all="terms">Термін друку</div><div class="fbtns">${TERMS[c.terms].map(t=>`<button class="fb ${f.terms.has(t.id)?'on':''}" data-f="terms" data-v="${t.id}" data-tip="${'Друк за '+(t.s||t.n)}">${t.n}${t.s?`<small>${t.s}</small>`:''}</button>`).join('')}</div></div>`;
  $('#filterCard').innerHTML=h;
}

function priceGroups(){
  const c=curCat(), f=S.f;
  if(!f.mats.size||!f.q.size) return null;
  const lams=c.lam?(f.lam.size?[...f.lam].sort():[0]):[null];
  const g=[];
  for(const mi of [...f.mats].sort((a,b)=>a-b)){ const m=c.mats[mi]; if(m.na) continue;
    for(const li of lams) for(const qk of c.q) if(f.q.has(qk)&&m.pr[qk]!=null) g.push({m,mi,li,qk}); }
  return g;
}

function renderPrice(){
  const c=curCat(); if(!$('#priceCard')) return;
  const groups=priceGroups();
  const terms=TERMS[c.terms].filter(t=>!S.f.terms.size||S.f.terms.has(t.id));
  const extra=(c.big==='weld'&&(S.opts.big||0)===0&&isBigItem())?1:0;
  const qLab=(c.qLabel||'якість друку').toLowerCase();
  let h=`<div class="ptbl-wrap"><table class="ptbl"><thead><tr>
    <th rowspan="2" style="width:22%">Матеріал</th><th rowspan="2" style="width:11%">${qLab}</th><th rowspan="2" style="width:14%">готовність</th>
    <th colspan="${S.tir.length}"><div class="tg">
      <span style="margin-right:auto">${S.delivery?'Вартість з доставкою':'Вартість без врахування доставки'}</span>
      <label class="tgl"><input type="checkbox" id="tDel" ${S.delivery?'checked':''}><i></i>з доставкою</label>
      <label class="tgl"><input type="checkbox" id="tPer" ${S.perUnit?'checked':''}><i></i>за екземпляр</label>
      <button class="xls" id="xls" title="Завантажити налаштований прайс Excel">XLS</button></div>
      <div style="text-align:right;margin-top:4px;font-weight:500">${S.perUnit?'За екземпляр':'За наклад'}</div></th></tr>
    <tr>${S.tir.map((t,i)=>`<th><select class="tir" data-ti="${i}">${[...new Set([...CFG.tirageList,t])].sort((a,b)=>a-b).map(v=>`<option ${v===t?'selected':''}>${v}</option>`).join('')}</select></th>`).join('')}</tr></thead><tbody>`;
  const cols=3+S.tir.length;
  if(!groups) h+=`<tr><td colspan="${cols}" class="empty">${S.f.mats.size?'Для формування прайс-листа оберіть '+qLab:'Щоб сформувати прайс оберіть матеріал, '+qLab}</td></tr>`;
  else if(!groups.length) h+=`<tr><td colspan="${cols}" class="empty">Немає доступних комбінацій матеріалу та друку</td></tr>`;
  else for(const g of groups){
    terms.forEach((t,ti)=>{
      const r=ready(t,extra);
      h+=`<tr class="${ti===0?'grp':''}">`;
      if(ti===0) h+=`<td class="g" rowspan="${terms.length}">${g.m.n}${g.li>0?`<div style="font-size:12px;color:var(--muted)">ламінація: ${c.lam[g.li].n.toLowerCase()}</div>`:''}</td><td class="g" rowspan="${terms.length}">${plain(Q[g.qk].n)}</td>`;
      h+=`<td class="rd"><b>${r.lab}</b>${r.txt}</td>`;
      for(const tir of S.tir){ const p=price(c,g.m,g.qk,g.li??0,t,tir);
        h+=p?`<td class="c" data-g="${g.mi}|${g.qk}|${g.li??0}|${t.id}|${tir}">${fmt(S.perUnit?p.per:p.total)}</td>`:`<td style="color:var(--muted)">—</td>`; }
      h+='</tr>';
    });
  }
  $('#priceCard').innerHTML=h+'</tbody></table></div>';
}

/* ---------- модалки ---------- */
function modal(html){ $('#modalBox').innerHTML=html+`<div style="text-align:right;margin-top:18px"><button class="btn" data-close>Закрити</button></div>`; $('#modal').classList.add('on'); }
const closeModal=()=>$('#modal').classList.remove('on');
const toast=t=>modal(`<h3>${t}</h3>`);

function openInfo(t){
  const c=curCat(); let b=`<h3>${t}</h3>`;
  if(t==='Ширина матеріалів та друку')

  let h=`<div style="display:flex;justify-content:space-between;align-items:center"><h3>Внутрішня інформація</h3><button class="ghost" data-dclose>✕</button></div>
   <p>Клієнт цього не бачить. У робочій версії налаштування — в адмінці, а розкладка — у черзі виробництва.</p>
   <div class="dset">
    <label>Рівень клієнта (призначає адмін)</label><select id="dLevel">${CFG.levels.map(l=>`<option value="${l.id}" ${l.id===CFG.level?'selected':''}>${l.name}${l.d?' −'+l.d*100+'%':''}</option>`).join('')}</select>
    <label>Націнка на обрізок, %</label><input id="dMarkup" type="number" value="${CFG.markup*100}">
    <label>Зазор під друк (рулон), см з кожного боку</label><input id="dMr" type="number" value="${CFG.marginRoll}">

    <label>Ділова смуга листа від, см</label><input id="dLo" type="number" value="${CFG.leftoverMin}">
   </div><div id="dCalc"></div>`;
  d.innerHTML=h; renderDrawerCalc();
}
function renderDrawerCalc(){
  const box=$('#dCalc'); if(!box) return;
  const c=S.cat&&curCat(); if(!c||c.kind==='form'){ box.innerHTML=''; return; }
  let key=S.picked;
  if(!key){ const g=priceGroups(); if(g&&g.length){ const t=TERMS[c.terms].find(t=>t.id==='d1')||TERMS[c.terms][0]; key=`${g[0].mi}|${g[0].qk}|${g[0].li??0}|${t.id}|${S.tir[0]}`; } }
  if(!key){ box.innerHTML='<p>Оберіть матеріал і якість друку у фільтрі — тут з’явиться розрахунок і розкладка. Натисніть на ціну в таблиці, щоб побачити саме її.</p>'; return; }
  const [mi,qk,li,tid,tir]=key.split('|'); const m=c.mats[+mi], t=TERMS[c.terms].find(x=>x.id===tid); const p=price(c,m,qk,+li,t,+tir);
  if(!p){ box.innerHTML=''; return; }
  const L=p.info.L;
  let h=`<h3 style="font-size:15px">${m.n}, ${plain(Q[qk].n)}, ${t.n}, ${tir} шт${S.kits>1?' × '+S.kits:''}</h3><div class="dsum"><table>`;
  if(c.kind==='stand') h+=`<tr><td>Конструкції</td><td>${fmt(S.standMode!==1?p.info.cons:0)}</td></tr><tr><td>Друк банера з обрізком</td><td>${fmt(p.info.prn)}</td></tr>`;
  else h+=`<tr><td>Друк ${fmt1(L.printArea)} м² × ${fmt1(m.pr[qk]*p.o.k+(p.info.lam||0))}</td><td>${fmt(p.info.printCost)}</td></tr>
    <tr><td>Обрізок ${fmt1(p.info.waste)} м² × ${fmt1(m.cost)} × ${fmt1(1+CFG.markup)}</td><td>${fmt(p.info.wasteCost)}</td></tr>
    ${p.o.lines.map(l=>`<tr><td>${l[0]}</td><td>${fmt(l[1])}</td></tr>`).join('')}
    ${p.info.seamCost?`<tr><td>Зпаювання частин ${fmt1(L.seam/100)} м × 24</td><td>${fmt(p.info.seamCost)}</td></tr>`:''}`;
  h+=`<tr><td>Термін ×${t.k}</td><td>${fmt(p.afterTerm)}</td></tr>${p.vd?`<tr><td>Знижка за тираж −${fmt1(p.vd*100)}%</td><td></td></tr>`:''}${p.lv?`<tr><td>Рівень клієнта −${p.lv*100}%</td><td></td></tr>`:''}${p.deliv?`<tr><td>Доставка (орієнтовно)</td><td>${fmt(p.deliv)}</td></tr>`:''}
    <tr><td><b>Разом</b></td><td><b>${fmt(p.total)}</b></td></tr></table></div>`;
  if(L){
    h+=L.kind==='roll'?`<div style="font-size:13px;margin-bottom:6px">Рулон <b>${L.W} см</b> · довжина <b>${fmt1(L.L/100)} м</b> · використано <b>${fmt1(L.used)} м²</b> · корисно <b>${fmt1(L.printArea/L.used*100)}%</b></div>`
      :`<div style="font-size:13px;margin-bottom:6px">Лист <b>${L.SW}×${L.SH} см</b> · листів <b>${L.n}</b> · рахуємо <b>${fmt1(L.used)} м²</b>${L.lastCounted<L.SH?' (останній — частково)':''} · корисно <b>${fmt1(L.printArea/L.used*100)}%</b></div>`;
    h+=`<div class="dviz">${drawLayout(L)}</div><div class="legend"><span><i style="background:var(--print)"></i>Друк</span><span><i style="background:var(--margin)"></i>Зазор ${L.m} см</span><span><i style="background:var(--waste)"></i>Залишок</span></div>`;
  }
  box.innerHTML=h;
}

function go(id){ try{ history.pushState(null,'',id?'#'+id:location.pathname); }catch(e){} route(id); }
function route(id){
  if(id==null) id=location.hash.slice(1);
  S.picked=null;
  let [pg,arg]=id.split('/');
  // кабінет — тільки після входу; після входу повертаємо туди, куди йшли
  if(PAGES[pg]&&!AUTH&&!['login','page'].includes(pg)){ C.after=id; id=pg='login'; arg=undefined; try{ history.replaceState(null,'','#login'); }catch(e){} }
  if(pg==='login'&&AUTH){ return go('orders'); }
  if(PAGES[pg]){ S.cat=null; C.page=pg; C.arg=arg; closeModal(); PAGES[pg](arg); renderMenu(MENU_OF[pg]??pg); renderDrawer(); window.scrollTo(0,0); return; }
  C.page=''; renderMenu('');
  if(!CATS[id]){ S.cat=null; renderHome(); renderDrawer(); window.scrollTo(0,0); return; }
  if(S.cat!==id){
    S.cat=id; S.vid=0; S.std=0; S.sizes=[]; S.kits=1; S.opts={}; S.standMode=0; S.termsOn=false;
    S.f={mats:new Set(CATS[id].mats&&CATS[id].mats.length===1?[0]:[]),q:new Set(),lam:new Set(),terms:new Set()};
  }
  if(CATS[id].kind==='form') renderCustom(); else renderProduct();
  renderDrawer(); window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>route());
window.addEventListener('popstate',()=>route());
function refresh(opts){ S.picked=null; if(opts) renderOpts(); renderPreview(); renderPrice(); renderDrawer(); }

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-close]')||t.id==='modal'){ closeModal(); return; }
  const gl=t.closest('[data-go]'); if(gl){ e.preventDefault(); go(gl.dataset.go); return; }
  const ts=t.closest('[data-toast]'); if(ts){ toast(ts.dataset.toast); return; }
  if(t.closest('[data-dclose]')||t.closest('#demoBtn')){ $('#drawer').classList.toggle('on'); renderDrawer(); return; }
  if(!app.contains(t)) return;
  const vid=t.closest('.vid'); if(vid){ S.vid=+vid.dataset.vid; S.std=0; S.opts={}; renderProduct(); renderDrawer(); return; }
  const inf=t.closest('[data-info]'); if(inf){ openInfo(inf.dataset.info); return; }
  if(t.id==='addSize'){ if(!S.sizes.length) S.sizes=[{w:'',h:''}]; S.sizes.push({w:'',h:''}); renderSize(); return; }
  const rm=t.closest('[data-rm]'); if(rm){ S.sizes.splice(+rm.dataset.rm,1); renderSize(); refresh(true); return; }
  const kb=t.closest('.stepper [data-k]'); if(kb){ S.kits=Math.max(1,S.kits+ +kb.dataset.k); $('#kits').value=S.kits; refresh(); return; }
  if(t.closest('#optClear')){ S.opts={}; refresh(true); return; }
  const chip=t.closest('.chip'); if(chip){ S.opts[chip.dataset.o]=+chip.dataset.v; refresh(true); return; }
  const fb=t.closest('.fb'); if(fb){ if(fb.classList.contains('dis')) return;
    const set=S.f[fb.dataset.f]; let v=fb.dataset.v; if(fb.dataset.f==='mats'||fb.dataset.f==='lam') v=+v;
    set.has(v)?set.delete(v):set.add(v);
    const c=curCat(); for(const k of [...S.f.q]) if(S.f.mats.size&&![...S.f.mats].some(i=>c.mats[i].pr[k]!=null)) S.f.q.delete(k);
    if(S.f.mats.size&&S.f.q.size) S.termsOn=true;
    S.picked=null; renderFilter(); renderPrice(); renderDrawer(); return; }
  const fa=t.closest('[data-all]'); if(fa){ const c=curCat(), k=fa.dataset.all;
    if(k==='mats'){ const all=c.mats.map((m,i)=>i).filter(i=>!c.mats[i].na); S.f.mats=S.f.mats.size===all.length?new Set():new Set(all); }
    if(k==='q'){ const all=c.q.filter(q=>(S.f.mats.size?[...S.f.mats].map(i=>c.mats[i]):c.mats).some(m=>m.pr[q]!=null)); S.f.q=S.f.q.size===all.length?new Set():new Set(all); }
    if(k==='lam'){ S.f.lam=S.f.lam.size===c.lam.length?new Set():new Set(c.lam.map((x,i)=>i)); }
    if(k==='terms'){ S.f.terms=new Set(); }
    if(S.f.mats.size&&S.f.q.size) S.termsOn=true;
    S.picked=null; renderFilter(); renderPrice(); renderDrawer(); return; }
  if(t.closest('#fReset')){ S.f={mats:new Set(curCat().mats.length===1?[0]:[]),q:new Set(),lam:new Set(),terms:new Set()}; S.termsOn=false; renderFilter(); renderPrice(); renderDrawer(); return; }
  const cell=t.closest('td.c'); if(cell){ openOrder(cell.dataset.g); return; }
  if(t.closest('#xls')){ exportCsv(); return; }
});
app.addEventListener('input',e=>{
  const t=e.target;
  const own=t.closest('.own'); if(own&&t.dataset.k){ const i=+own.dataset.i; if(!S.sizes.length) S.sizes=[{w:'',h:''}]; S.sizes[i][t.dataset.k]=t.value; refresh(true); return; }
  if(t.id==='kits'){ S.kits=Math.max(1,Math.floor(+t.value)||1); refresh(); return; }
  if(t.dataset.pl){ S.plotLen[t.dataset.pl]=+t.value||0; refresh(); return; }
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='stdSel'){ S.std=+t.value; S.sizes=[]; renderSize(); refresh(true); return; }
  if(t.id==='unit'){ const k=t.value==='mm'?10:0.1; S.sizes.forEach(s=>{ if(s.w!=='') s.w=+(s.w*k).toFixed(2); if(s.h!=='') s.h=+(s.h*k).toFixed(2); }); S.unit=t.value; renderSize(); refresh(); return; }
  if(t.dataset.o){ S.opts[t.dataset.o]=+t.value; refresh(true); return; }
  if(t.name==='sm'){ S.standMode=+t.value; refresh(); return; }
  if(t.name==='pl'){ S.plotLen.mode=+t.value; refresh(); return; }
  if(t.classList.contains('tir')){ S.tir[+t.dataset.ti]=+t.value; renderPrice(); return; }
  if(t.id==='tDel'){ S.delivery=t.checked; renderPrice(); renderDrawer(); return; }
  if(t.id==='tPer'){ S.perUnit=t.checked; renderPrice(); return; }
});
$('#drawer').addEventListener('input',e=>{

function exportCsv(){

  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+rows.join('\n')],{type:'text/csv;charset=utf-8'})); a.download='prais.csv'; a.click();
}

function placeOrder(){
  const d=C.draft, k=C.ck; if(!d) return;
  const id=Math.max(...ORDERS.map(o=>o.id))+1, now=new Date();
  const bonUse=k.bon?Math.round(Math.min(bonus(),d.sum*BONUS_RULES.maxPart/100)*100)/100:0;
  const files=Object.values(k.files).map(n=>({n,st:'wait'}));
  const o={id,d:now,cat:d.catId,title:(k.title||'').trim(),name:d.name,q:d.q,size:d.size,tir:d.tir,kits:d.kits,opts:d.opts,term:d.term,ready:d.readyDate,
    sum:d.sum,paid:0,st:files.length?'check':'new',deliv:{t:k.deliv==='self'?'self':'np',r:k.r},files,comment:(k.comment||'').trim()};
  ORDERS.unshift(o);
  if(bonUse){ BON.push({d:now,t:'Списано при оплаті',o:id,s:-bonUse}); o.paid+=bonUse; }
  if(k.pay==='bal'||k.pay==='card'){
    const s=d.sum-bonUse;
    if(k.pay==='card') TX.push({d:now,t:'Поповнення карткою (оплата замовлення)',s});
    TX.push({d:now,t:'Оплата замовлення',o:id,s:-s}); o.paid+=s;
  }
  if(k.pay==='inv') INV.unshift({n:'СФ-'+(3122+INV.length),d:now,o:[id],s:d.sum-bonUse,paid:false});
  addMsg({from:'Система',o:id,t:`Замовлення №${id} прийнято.`+(files.length?' Макет передано на перевірку.':' Завантажте макет у картці замовлення.')+(k.pay==='inv'?' Рахунок сформовано — він у розділі «Фінанси».':'')});
  C.draft=null; C.ck={deliv:'np',pay:'card',r:0,files:{},bon:false};
  go('order/'+id);
}

/* ---------- Доставки ---------- */
function delivState(o){
  if(o.st==='done') return ['Отримано','gray'];
  if(o.st==='sent') return ['В дорозі','cyan'];
  if(o.st==='ready') return o.deliv.t==='self'?['Готово до видачі','green']:['Формується відправка','amber'];
  return ['Очікує виготовлення','gray'];
}
function pDeliv(){
  const live=ORDERS.filter(o=>o.st!=='cancel');
  const np=live.filter(o=>o.deliv.t!=='self'), self=live.filter(o=>o.deliv.t==='self');
  const list=C.dtab==='np'?np:self;
  const rows=list.map(o=>{ const [s,c]=delivState(o), g=`data-go="order/${o.id}"`;
    return `<tr class="row"><td ${g}><b>№${o.id}</b><small>${CATS[o.cat]?CATS[o.cat].n:''}, ${o.tir} шт</small></td>

  app.innerHTML=pageH('Доставки')+
  `<div class="seg"><a class="${C.dtab==='np'?'on':''}" data-act="dtab" data-v="np">Нова Пошта<b>${np.filter(o=>o.st!=='done').length}</b></a><a class="${C.dtab==='self'?'on':''}" data-act="dtab" data-v="self">Самовивіз<b>${self.filter(o=>o.st==='ready').length}</b></a></div>

function msgDo(ids,v){
  for(const id of ids){ const i=MSGS.findIndex(m=>m.id===id); if(i<0) continue;
    if(v==='del') MSGS.splice(i,1); else if(v==='read') MSGS[i].read=true; else if(v==='unread') MSGS[i].read=false;
    else if(v==='arch'){ MSGS[i].arch=true; MSGS[i].read=true; } else if(v==='unarch') MSGS[i].arch=false; }
  C.msel.clear(); if(v==='unread') C.mopen=null;
}

  `<div class="stats"><div class="stat"><div class="k">Бонусний рахунок</div><div class="v">${fmt(bonus())} <small>грн</small></div><div class="s">1 бонус = 1 грн</div></div>
    <div class="stat"><div class="k">Нараховано всього</div><div class="v">${fmt(earned)} <small>грн</small></div><div class="s">За весь час</div></div>
    <div class="stat"><div class="k">Нарахування</div><div class="v">${BONUS_RULES.pct}%</div><div class="s">від суми виконаних замовлень</div></div></div>
  <div class="cols"><div class="card flush"><div class="bar"><b>Історія</b></div><div class="tbl-wrap"><table class="tbl" style="min-width:520px"><thead><tr><th>Дата</th><th>Операція</th><th class="r">Бонуси</th><th class="r">Залишок</th></tr></thead><tbody>
    ${rows.map(b=>`<tr><td>${dstr(b.d)}</td><td>${b.t}${b.o?' '+oLink(b.o):''}</td><td class="r ${b.s>0?'plus':'minus'}">${sign(b.s)}</td><td class="r">${fmt(b.after)}</td></tr>`).join('')}</tbody></table></div></div>
   <div class="card"><div class="card-h"><h2>Як це працює</h2></div><div style="display:grid;gap:10px;font-size:14px">
    <div>• За кожне виконане замовлення нараховуємо <b>${BONUS_RULES.pct}%</b> від його вартості.</div>
    <div>• Бонусами можна оплатити до <b>${BONUS_RULES.maxPart}%</b> вартості нового замовлення — галочка на кроці оплати.</div>
    <div>• Бонуси не обмінюються на гроші й не переносяться на інший кабінет.</div>
    <p class="muted" style="font-size:12.5px;margin:4px 0 0">Відсотки й правила — приклад, у робочій версії задаються в адмінці.</p></div></div></div>`;
}

  `<div class="cols"><div>
   <div class="card"><div class="card-h"><h2>Нове звернення</h2></div><div class="fgrid">
     <div><div class="lbl">Тема</div><select class="sel" id="tkSubj">${['Питання щодо замовлення','Макет і підготовка файлів','Оплата і документи','Доставка','Скарга на якість','Пропозиція','Інше'].map(s=>`<option>${s}</option>`).join('')}</select></div>
     <div><div class="lbl">Замовлення</div><select class="sel" id="tkOrd"><option value="">Без замовлення</option>${act.map(o=>`<option value="${o.id}">№${o.id} — ${CATS[o.cat]?CATS[o.cat].n:''}</option>`).join('')}</select></div>
     <div class="full"><div class="lbl">Повідомлення</div><textarea class="area" id="tkText" style="min-height:110px" placeholder="Опишіть питання — менеджер відповість у «Листуванні»"></textarea></div>
     <div class="full" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><label class="btn" style="display:inline-flex;align-items:center;gap:6px">${I.upload}Прикріпити файл<input type="file" hidden id="tkFile"></label><span class="muted" id="tkFn" style="font-size:13px"></span><span class="grow"></span><button class="btn pri" data-act="tksend">Надіслати</button></div></div></div>
   <div class="card flush"><div class="bar"><b>Мої звернення</b></div><div class="tbl-wrap"><table class="tbl" style="min-width:520px"><thead><tr><th>№</th><th>Тема</th><th>Дата</th><th>Стан</th></tr></thead><tbody>
     ${TICKETS.map(t=>`<tr><td>#${t.id}</td><td>${esc(t.subj)}${t.o?`<small>Замовлення №${t.o}</small>`:''}</td><td>${dstr(t.d)}</td><td><span class="badge b-${t.st==='Закрито'?'gray':t.st==='Нове'?'amber':'green'}">${t.st}</span></td></tr>`).join('')}</tbody></table></div></div>
   <div class="card faq"><div class="card-h"><h2>Часті питання</h2></div>${FAQ.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div>
  </div><div class="sticky">
   <div class="card"><div class="card-h"><h2>Контакти</h2></div><div class="contacts"><div class="big">0 800 00-00-00</div><div>+380 (00) 000-00-00<br>+380 (00) 000-00-00</div>
     <div><a>info@example.com</a></div>
     <table class="sum" style="font-size:13px"><tr><td class="muted">Офіс, Пн–Пт</td><td>9:00 — 19:30</td></tr><tr><td class="muted">Офіс, Сб</td><td>9:30 — 17:30</td></tr><tr><td class="muted">Склад, Пн–Сб</td><td>9:00 — 18:00</td></tr></table>
     <div class="muted" style="font-size:13px">Прийом замовлень на сайті — цілодобово.</div></div></div>
   <div class="card"><div class="card-h"><h2>Корисне</h2></div><div style="display:grid;gap:8px;font-size:14px">
     <a data-act="req">Вимоги до макета</a><a data-go="page/offer">Публічна оферта</a><a data-go="page/terms">Умови використання</a></div></div>
  </div></div>`;
}

/* ---------- Вхід / реєстрація ---------- */

  const reg=C.atab==='reg';
  app.innerHTML=`<div class="auth"><div class="card" style="padding:28px"><div class="tabs2"><a class="${reg?'':'on'}" data-act="atab" data-v="in">Вхід</a><a class="${reg?'on':''}" data-act="atab" data-v="reg">Реєстрація</a></div>
   ${C.after&&C.after!=='orders'?'<div class="alert info" style="font-size:13px">Увійдіть, щоб продовжити.</div>':''}
   <div style="display:grid;gap:12px">${reg?`<div><div class="lbl">Ім’я та прізвище</div><input class="inp" id="lgName" autocomplete="name"></div>`:''}
    <div><div class="lbl">Телефон або email</div><input class="inp" id="lgLogin" autocomplete="username"></div>
    <div><div class="lbl">Пароль${reg?' (від 6 символів)':''}</div><input class="inp" id="lgPass" type="password" autocomplete="${reg?'new-password':'current-password'}"></div>
    ${reg?`<label class="check" style="font-size:13px"><input type="checkbox" id="lgOffer">Погоджуюсь з <a data-go="page/offer">публічною офертою</a></label>`:''}
    <div id="lgErr" style="color:var(--bad);font-size:13px;min-height:18px"></div>
    <button class="btn pri" style="height:44px" data-act="${reg?'register':'login'}">${reg?'Зареєструватися':'Увійти'}</button>
    ${reg?'':'<a style="text-align:center;font-size:13px" data-toast="Тестова версія: відновлення пароля через SMS або email">Забули пароль?</a>'}</div></div>
   <div class="card" style="font-size:13px;border-style:dashed"><b>Тестовий доступ клієнта</b><br>Логін: olena@example.com або 067 123 45 67<br>Пароль: client123
    <div class="muted" style="margin-top:6px">Тестова версія: дані зберігаються до перезавантаження сторінки.</div></div></div>`;
}

/* ---------- Інфосторінки ---------- */
function pPage(id){
  const t={offer:'Публічна оферта',terms:'Умови використання'}[id]||'Сторінка';
  app.innerHTML=pageH(t)+`<div class="card doc-page"><p>Текст сторінки редагується в адмінці. Тут буде повний текст документа: предмет договору, порядок оформлення й оплати замовлень, терміни виготовлення, вимоги до макетів, доставка, гарантії й повернення, відповідальність сторін, реквізити.</p>
   <h2>1. Загальні положення</h2><p>…</p><h2>2. Оформлення замовлення</h2><p>…</p><h2>3. Оплата</h2><p>…</p></div>`;
}

const PAGES={orders:pOrders,order:pOrder,checkout:pCheckout,deliveries:pDeliv,finance:pFinance,messages:pMessages,profile:pProfile,bonus:pBonus,support:pSupport,login:pLogin,page:pPage};
const MENU_OF={order:'orders',checkout:'',page:''};
function rr(){ const y=window.scrollY; PAGES[C.page](C.arg); renderMenu(MENU_OF[C.page]??C.page); window.scrollTo(0,y); }

/* ---------- модалки кабінету ---------- */
function payModal(ids){
  const os=ids.map(ordById).filter(o=>o&&!isPaid(o)); if(!os.length) return;
  const s=os.reduce((a,o)=>a+due(o),0), bal=balance();
  modal(`<h3>Оплата ${os.length>1?os.length+' замовлень':'замовлення №'+os[0].id}</h3><p style="font-size:22px;font-weight:700;margin:0 0 14px">${fmt(s)} грн</p>
   <div class="rcards">${['bal','card','inv'].map(k=>{ const dis=k==='bal'&&bal<s; return `<a class="rcard ${dis?'dis':''}" data-act="${dis?'':'dopay'}" data-v="${k}" data-ids="${os.map(o=>o.id).join(',')}"><b>${PAY[k].n}</b><span>${k==='bal'?`Доступно ${fmt(bal)} грн${dis?' — недостатньо':''}`:PAY[k].s}</span></a>`; }).join('')}</div>`);
}
function doPay(ids,how){
  const os=ids.map(ordById).filter(o=>o&&!isPaid(o)), now=new Date();
  if(how==='inv'){ const s=os.reduce((a,o)=>a+due(o),0), n='СФ-'+(3122+INV.length); INV.unshift({n,d:now,o:os.map(o=>o.id),s,paid:false});
    closeModal(); toast(`Рахунок ${n} на ${fmt(s)} грн сформовано. Він у розділі «Фінанси → Рахунки».`); C.osel.clear(); rr(); return; }
  for(const o of os){ const s=due(o);
    if(how==='card') TX.push({d:now,t:'Поповнення карткою (оплата замовлення)',s});
    TX.push({d:now,t:'Оплата замовлення',o:o.id,s:-s}); o.paid+=s;
    if(o.st==='new'||(o.st==='check'&&o.files.length&&o.files.every(f=>f.st==='ok'))) o.st='paid';
    addMsg({from:'Бухгалтерія',o:o.id,t:`Оплату ${fmt(s)} грн за замовлення №${o.id} отримано.`+(o.st==='paid'?' Замовлення передано в друк.':' Після перевірки макета замовлення піде в друк.')}); }
  C.osel.clear(); closeModal(); rr();
}

/* ---------- події кабінету ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'); if(!a||!a.dataset.act) return;
  const v=a.dataset.v, id=a.dataset.id?+a.dataset.id:null;
  switch(a.dataset.act){
    case 'otab': C.otab=v; C.osel.clear(); rr(); break;
    case 'osel': a.checked?C.osel.add(id):C.osel.delete(id); rr(); break;
    case 'opay': payModal([...C.osel]); break;
    case 'oinv': doPay([...C.osel],'inv'); break;
    case 'pay': payModal([id]); break;
    case 'dopay': doPay(a.dataset.ids.split(',').map(Number),v); break;
    case 'invoice': { const o=ordById(id), ex=INV.find(x=>x.o.includes(id));
      if(ex) toast(`Рахунок ${ex.n} уже є — «Фінанси → Рахунки».`); else if(isPaid(o)) toast('Замовлення оплачене — рахунок і акт будуть у розділі «Фінанси».'); else doPay([id],'inv'); break; }
    case 'repeat': { const o=ordById(id); toast(`Відкриваємо калькулятор «${CATS[o.cat].n}». У робочій версії параметри замовлення №${id} підставляться автоматично.`); setTimeout(()=>{ closeModal(); go(o.cat); },1400); break; }
    case 'cancel': modal(`<h3>Скасувати замовлення №${id}?</h3><p class="muted">Замовлення ще не оплачене й не в друці, тому скасування безкоштовне.</p><button class="btn pri" data-act="docancel" data-id="${id}">Так, скасувати</button>`); break;
    case 'docancel': { const o=ordById(id); o.st='cancel'; addMsg({from:'Система',o:id,t:`Замовлення №${id} скасовано на ваш запит.`,read:true}); closeModal(); rr(); break; }
    case 'rework': modal(`<h3>Доопрацювання макета${id?' · №'+id:''}</h3><p class="muted" style="margin-top:0">Дизайнер виправить макет за вас. Вартість залежить від обсягу роботи — ми повідомимо її після перегляду, і вона додасться до замовлення.</p>
       <div class="lbl">Що потрібно змінити (необов’язково)</div><textarea class="area" style="min-height:90px"></textarea><div style="margin-top:12px"><button class="btn pri" data-act="dorework" data-id="${id}">Замовити доопрацювання</button></div>`); break;
    case 'dorework': { const o=ordById(id); o.reworkReq=true; o.st='check'; o.fix=null;
      addMsg({from:'Препрес',o:id,t:`Запит на доопрацювання макета для №${id} прийнято. Вартість: 150.00 грн — додано до замовлення. Виправлений макет надішлемо на погодження.`}); o.rework=150;
      closeModal(); if(C.page==='order') rr(); else go('order/'+id); break; }
    case 'reply': { const tx=$('#replyTx').value.trim(); if(!tx) return; REPLIES.push({o:id,d:new Date(),t:tx}); rr(); break; }
    case 'req': openInfo('Інструкція по оформленню замовлення'); break;
    case 'ckd': C.ck.deliv=v; rr(); break;
    case 'ckr': C.ck.r=+v; rr(); break;
    case 'ckp': C.ck.pay=v; rr(); break;
    case 'place': placeOrder(); break;
    case 'dtab': C.dtab=v; rr(); break;
    case 'ftab': C.ftab=v; rr(); break;
    case 'topup': case 'mkinv': modal(`<h3>${a.dataset.act==='topup'?'Поповнення балансу':'Рахунок на поповнення'}</h3><div class="lbl">Сума, грн</div><input class="inp" id="tuSum" type="number" min="1" value="1000" style="max-width:200px">
       <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">${a.dataset.act==='topup'?`<button class="btn pri" data-act="dotopup" data-v="card">Оплатити карткою</button>`:''}<button class="btn ${a.dataset.act==='mkinv'?'pri':''}" data-act="dotopup" data-v="inv">Сформувати рахунок</button></div>`); break;
    case 'dotopup': { const s=+$('#tuSum').value; if(!(s>0)) return; const now=new Date();
      if(v==='card'){ TX.push({d:now,t:'Поповнення балансу карткою',s}); closeModal(); }
      else { const n='СФ-'+(3122+INV.length); INV.unshift({n,d:now,o:[],t:'Поповнення балансу',s,paid:false}); C.ftab='inv'; closeModal(); toast(`Рахунок ${n} на ${fmt(s)} грн сформовано.`); }
      rr(); break; }
    case 'mf': C.mf=v; C.msel.clear(); C.mopen=null; rr(); break;
    case 'msel': e.stopPropagation(); a.checked?C.msel.add(id):C.msel.delete(id); rr(); break;
    case 'mall': { const list=[...document.querySelectorAll('.mi [data-act=msel]')].map(x=>+x.dataset.id); C.msel=a.checked?new Set(list):new Set(); rr(); break; }
    case 'mbulk': msgDo([...C.msel],v); rr(); break;
    case 'mone': msgDo([id],v); rr(); break;
    case 'mopen': { if(e.target.closest('button,a,input')) return; const m=MSGS.find(x=>x.id===id); C.mopen=C.mopen===id?null:id; if(m) m.read=true; rr(); break; }
    case 'mfwd': modal(`<h3>Переслати повідомлення</h3><div class="lbl">Email отримувача</div><input class="inp" type="email" placeholder="name@example.com"><div style="margin-top:12px"><button class="btn pri" data-toast="Тестова версія: повідомлення не надсилається">Переслати</button></div>`); break;
    case 'ptype': ME.type=v; rr(); break;
    case 'psave': toast('Тестова версія: дані профілю не зберігаються'); break;
    case 'radd': modal(`<h3>Новий отримувач</h3><div class="fgrid"><div><div class="lbl">ПІБ</div><input class="inp" id="rN"></div><div><div class="lbl">Телефон</div><input class="inp" id="rP" type="tel"></div>
       <div><div class="lbl">Місто</div><input class="inp" id="rC"></div><div><div class="lbl">Відділення або поштомат</div><input class="inp" id="rW"></div></div><div style="margin-top:12px"><button class="btn pri" data-act="dorAdd">Додати</button></div>`); break;
    case 'dorAdd': { const n=$('#rN').value.trim(); if(!n) return; ME.recips.push({n,ph:$('#rP').value.trim(),city:$('#rC').value.trim(),wh:$('#rW').value.trim()}); closeModal(); rr(); break; }
    case 'rdel': ME.recips.splice(id,1); rr(); break;
    case 'tksend': { const tx=$('#tkText').value.trim(); if(!tx) return; const o=$('#tkOrd').value;
      TICKETS.unshift({id:Math.max(...TICKETS.map(t=>t.id))+1,d:new Date(),subj:$('#tkSubj').value,o:o?+o:null,st:'Нове'});
      addMsg({from:'Підтримка',o:o?+o:null,t:'Звернення отримано. Менеджер відповість тут, у «Листуванні», найближчим часом.'}); rr(); break; }
    case 'atab': C.atab=v; rr(); break;
    case 'login': { const l=normLogin($('#lgLogin').value), p=$('#lgPass').value;
      if(!DEMO_CLIENT.logins.map(normLogin).includes(l)||p!==DEMO_CLIENT.pass){ $('#lgErr').textContent='Невірний логін або пароль'; return; }
      setAuth(true); const to=C.after||'orders'; C.after=null; go(to); break; }
    case 'register': { const n=$('#lgName').value.trim(), l=$('#lgLogin').value.trim(), p=$('#lgPass').value;
      if(!n||!l){ $('#lgErr').textContent='Вкажіть ім’я і телефон або email'; return; }
      if(p.length<6){ $('#lgErr').textContent='Пароль — від 6 символів'; return; }
      if(!$('#lgOffer').checked){ $('#lgErr').textContent='Потрібна згода з офертою'; return; }
      ME.name=n; if(l.includes('@')) ME.email=l; else ME.phone=l; setAuth(true); const to=C.after||'orders'; C.after=null; go(to); break; }
    case 'logout': setAuth(false); C.after=null; go('login'); break;
    case 'checkout': closeModal(); go('checkout'); break;
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&['lgLogin','lgPass','lgName'].includes(e.target.id)) document.querySelector('[data-act=login],[data-act=register]')?.click(); });
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.kf!=null&&t.files[0]){ C.ck.files[+t.dataset.kf]=t.files[0].name; rr(); }
  if(t.dataset.upl&&t.files[0]){ const o=ordById(t.dataset.upl); o.files.push({n:t.files[0].name,st:'wait'}); if(o.st==='fix'||o.st==='new'){ o.st='check'; o.fix=null; }
    addMsg({from:'Система',o:o.id,t:`Макет ${t.files[0].name} отримано й передано на перевірку.`}); rr(); }
  if(t.id==='ckBon'){ C.ck.bon=t.checked; rr(); }
  if(t.id==='tkFile'&&t.files[0]) $('#tkFn').textContent=t.files[0].name;
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='oq'){ C.oq=t.value; rr(); const n=$('#oq'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); }
  if(t.id==='ckTitle') C.ck.title=t.value;
  if(t.id==='ckCom') C.ck.comment=t.value;
});

route();
</script>
