<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Адмінка друку</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
/* ---------- адмінка ---------- */
.atop{display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}
.atop .logo small{font-size:12px;font-weight:600;color:#a5b4fc;margin-left:4px;letter-spacing:.04em;text-transform:uppercase}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:#cbd5e1;flex-wrap:wrap}
.who select{height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;padding:0 10px}
.who select option{color:#111}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.off{background:var(--dis)}
.alay{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;max-width:1360px;margin:0 auto;padding:0 24px}
.alay.solo{grid-template-columns:minmax(0,1fr)}
.side{position:sticky;top:16px;align-self:start;margin-top:24px;display:flex;flex-direction:column;gap:2px}
.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--ink);font-weight:500;font-size:14px}
.side a svg{width:18px;height:18px;color:var(--muted)}
.side a:hover{background:var(--card)}
.side a.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
.side a.on svg{color:var(--accent)}
.side a b{margin-left:auto;font-size:11px;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 7px;line-height:18px}
.side .sep{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:14px 12px 4px}
.amain{min-width:0;padding-bottom:40px}
.lay-mini{overflow-x:auto;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
.grp{margin-bottom:16px}
.grp-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.grp-h h2{font-size:17px;margin:0}
.pjob{border-top:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px}
.pjob:first-of-type{border-top:0;padding-top:0}
.pjob .lay-mini{grid-column:1/-1;margin-top:0}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn.sm{height:32px;padding:0 12px;font-size:11.5px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad)}
.btn.bad:hover{border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.lock{font-size:12.5px;color:var(--muted);background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.ed{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--soft);font-variant-numeric:tabular-nums;min-width:64px}
.ed:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--card)}
.tbl td.e{padding:6px 8px}
.tbl.compact td{padding:8px 12px}
.log{font-size:12.5px;color:var(--muted);display:grid;gap:4px}
.log b{color:var(--ink);font-weight:500}
.free{color:var(--amber-fg);font-weight:600;font-size:12.5px}
.cols.narrow{grid-template-columns:minmax(0,1fr) 260px}
.cols.half{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.xb{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;font-size:13px;flex:0 0 30px;display:inline-grid;place-items:center}
.xb:hover{border-color:var(--bad);color:var(--bad)}
.xb[disabled]{opacity:.35;cursor:default;border-color:var(--line);color:var(--muted)}
.hint{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--soft);border:1px solid var(--line);font-size:10px;color:var(--muted);cursor:help;vertical-align:1px}
.mat-h,.opt-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.mat.na{opacity:.7;border-style:dashed}
.mat-g{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);gap:14px}
.rolls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.roll{display:inline-flex;gap:4px;align-items:center}
.ed.w{width:80px;min-width:0}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.qgrid label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.chk{display:flex;flex-wrap:wrap;gap:8px 16px}
.chk .check{font-size:13px}
.pl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}.pl .ed{width:80px}
.ed.ta{height:auto;min-height:52px;padding:6px 8px;resize:vertical;min-width:240px;font-size:13px;line-height:1.4}
select.ed{padding-right:24px;background-position:right 8px center}
.subopt{margin-left:28px;border-left:3px solid var(--accent-soft)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ph{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft);display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--line)}
.ph .ed{border-radius:0;border-width:1px 0;background:var(--card)}
.ph-a{display:flex;gap:6px;padding:6px}
.ph-add{min-height:180px}
.perm td,.perm th{text-align:center}.perm td:first-child,.perm th:first-child{text-align:left}
.perm input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}.perm input:disabled{cursor:default}
.rh{display:flex;gap:4px;align-items:center;justify-content:center}.rh .ed{width:120px;text-transform:none;letter-spacing:0;font-weight:600}
.qcats{display:flex;flex-wrap:wrap;gap:6px;min-width:300px}
.qc{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;cursor:pointer;background:var(--card);color:var(--muted)}
.qc input{width:14px;height:14px;accent-color:var(--accent);margin:0}
.qc.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}
.qc:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px}
.swatch{width:40px;height:32px;border:1px solid var(--line);border-radius:8px;padding:0;background:none;cursor:pointer}
@media (max-width:900px){
  .alay{grid-template-columns:minmax(0,1fr);padding:0 16px}
  .side{position:static;flex-direction:row;overflow-x:auto;margin-top:16px;gap:4px;padding-bottom:4px}
  .side a{white-space:nowrap}
  .side .sep{display:none}
  .atop{padding:12px 16px}
  .who{margin-left:0}
  .cols.narrow,.cols.half{grid-template-columns:minmax(0,1fr)}
  .stats.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mat-g{grid-template-columns:minmax(0,1fr)}
  .subopt{margin-left:0}
}
</style>
</head>

function lay(o){ // внутрішня розкладка: розміри в см, тираж × комплекти
  const c=o.cat==='stands'?CATS.banner:CATS[o.cat];
  return layout(c,matOf(o),[{w:o.w/10,h:o.h/10}],o.tir*o.kits);
}
function costOf(o){
  const L=lay(o), m=matOf(o); if(!L) return null;
  const material=L.used*m.cost, ink=L.printArea*(INK[o.qk]||0), waste=Math.max(0,L.used-L.printArea);
  const extra=o.cat==='stands'?o.tir*o.kits*180:0; // конструкції
  const cost=material+ink+extra;
  return {L,material,ink,extra,waste,cost,margin:o.sum+o.rework-cost};
}

const STABS=[['cats','Категорії й розміри'],['mats','Матеріали й ціни'],['q','Якості друку'],['opts','Опції'],['terms','Терміни й знижки'],['general','Обрізок і поля'],['levels','Рівні клієнтів'],['texts','Тексти й фото'],['brand','Бренд']];
const TERM_GROUPS={std:'Банер, плівка, папір, ПВХ, акрил, полотна',short:'Пінокартон, мобільні стенди',long:'Композит'};

/* --- ціна варіанта опції: одне число + «за що» --- */
const UNITS=[['none','без доплати'],['piece','грн за 1 виріб'],['area','грн за 1 м² виробу'],['perim','грн за 1 м пог. периметра'],['perimCm','грн за 1 см периметра'],
  ['pocket','грн за 1 м пог. кишені'],['eyelet','грн за 1 люверс'],['hole','грн за 1 отвір'],['cutline','грн за 1 м пог. лінії порізки'],['k','× множник до ціни друку'],['perimTh','× до тарифу порізки ПВХ']];
const PRICE_KEYS=['p','per','k','ep','pm','hp','x'];
function unitOf(ch){ if(ch.k!=null) return 'k'; if(ch.ep!=null) return 'eyelet'; if(ch.pm!=null) return 'cutline'; if(ch.holes!=null) return 'hole'; return ch.per||'none'; }
function priceOf(ch){ return {k:ch.k,eyelet:ch.ep,cutline:ch.pm,hole:ch.hp??4,perimTh:ch.x??1,none:''}[unitOf(ch)] ?? ch.p ?? ''; }
function setPrice(ch,u,val){
  const holes=ch.holes; PRICE_KEYS.forEach(k=>delete ch[k]); const v=val===''||val==null||isNaN(+val)?null:+val;
  if(u==='k') ch.k=v??1; else if(u==='eyelet') ch.ep=v??0; else if(u==='cutline') ch.pm=v??0;
  else if(u==='hole'){ ch.hp=v??0; ch.holes=holes??1; } else if(u==='perimTh'){ ch.per='perimTh'; ch.x=v??1; }
  else if(u!=='none'){ ch.per=u; ch.p=v??0; }
  if(u!=='hole') delete ch.holes;
}
const POS_N={trbl:'по периметру',c4:'4 по кутах',c8:'8: кути + середини',t:'зверху',b:'знизу',tb:'зверху та знизу',lr:'зліва та справа'};

function pSettings(){
  if(!can('settings')){ app.innerHTML=noAccess(); return; }
  const tabs=STABS.filter(t=>t[0]!=='levels'||can('levels'));
  const body={cats:sCats,mats:sMats,q:sQ,opts:sOpts,terms:sTerms,general:sGeneral,levels:sLevels,texts:sTexts,brand:sBrand}[U.stab]();

/* --- дії налаштувань --- */
let PENDING=null;
function ask(text,fn){ PENDING=fn; modal(`<h3>${esc(text)}</h3><p class="muted" style="margin-top:0">Дію не можна скасувати.</p><button class="btn pri" data-act="sYes">Так, видалити</button>`); return true; }
function settingsClick(a){
  const d=a.dataset, i=d.i!=null?+d.i:null, j=d.j!=null?+d.j:null, c=CATS[U.scat];
  const sizes=()=>c.kind==='stand'?c.vids[Math.min(U.svid||0,c.vids.length-1)].sizes:c.std;
  switch(d.act){
    case 'sYes': { const f=PENDING; PENDING=null; closeModal(); if(f) f(); break; }
    case 'stab': U.stab=d.v; break;
    case 'scat': U.scat=d.v; U.svid=0; break;
    case 'svid': U.svid=+d.v; break;
    case 'sAddCat': { const key='c'+Date.now().toString(36); CATS[key]={n:'Нова категорія',d:'',kind:'roll',ico:'banner',terms:'std',big:'parts',std:[[1000,1000]],q:['q720'],
      mats:[{n:'Новий матеріал',t:'',rolls:[160],cost:0,pr:{q720:0}}],opts:[]}; ORDER.splice(ORDER.length,0,key); U.scat=key; break; }
    case 'sDelCat': { const id=U.scat, n=ORD.filter(o=>o.cat===id&&open_(o)).length;
      return ask(`Видалити категорію «${c.n}» з сайту?${n?` Незакриті замовлення (${n}) залишаться в CRM.`:''}`,()=>{ ORDER.splice(ORDER.indexOf(id),1); c.deleted=1; U.scat=ORDER.find(k=>CATS[k].kind!=='form'); }); }
    case 'sAddSize': sizes().push(c.kind==='stand'?[800,2000,0]:[1000,1000]); break;
    case 'sDelSize': return ask('Видалити розмір?',()=>{ sizes().splice(i,1); });
    case 'sAddMat': c.mats.push(c.kind==='sheet'?{n:'Новий матеріал',t:'',sheet:[200,300],cost:0,pr:{}}:{n:'Новий матеріал',t:'',rolls:[160],cost:0,pr:{}}); break;
    case 'sDelMat': return ask(`Видалити матеріал «${c.mats[i].n}»?`,()=>{ c.mats.splice(i,1); });
    case 'sAddRoll': c.mats[i].rolls.push(Math.max(...c.mats[i].rolls)+50); break;
    case 'sDelRoll': c.mats[i].rolls.splice(j,1); break;
    case 'sAddQ': { const k='q'+Date.now().toString(36); Q[k]={n:'Нова якість',t:''}; INK[k]=0; break; }
    case 'sDelQ': { const k=d.k, used=ORDER.filter(id=>CATS[id].q&&CATS[id].q.includes(k)).map(id=>CATS[id].n);
      return ask(`Видалити якість «${plain(Q[k].n)}»?${used.length?` Її буде прибрано з категорій: ${used.join(', ')} — і ціни матеріалів для неї теж.`:''}`,()=>{
        for(const id of Object.keys(CATS)){ const C=CATS[id]; if(C.q) C.q=C.q.filter(x=>x!==k); (C.mats||[]).forEach(m=>{ if(m.pr) delete m.pr[k]; }); }
        delete Q[k]; delete INK[k]; }); }
    case 'sAddVar': OPT[d.key].c.push({l:'Новий варіант',p:0,per:'piece'}); break;
    case 'sDelVar': OPT[d.key].c.splice(i,1); break;
    case 'sAddOpt': { const key='o'+Date.now().toString(36); OPT[key]={id:key,l:'Нова опція',t:'select',c:[{l:'Ні'},{l:'Так',p:0,per:'piece'}]}; (c.opts=c.opts||[]).push(key); break; }
    case 'sDelOpt': return ask(`Прибрати опцію «${OPT[d.key].l}» з категорії «${c.n}»?`,()=>{ c.opts=c.opts.filter(k=>k!==d.key); });
    case 'sAddTerm': TERMS[d.g].push({id:'t'+Date.now().toString(36),n:'Новий термін',s:'',days:1,k:1}); break;
    case 'sDelTerm': TERMS[d.g].splice(i,1); break;
    case 'sAddVol': CFG.volume.push({q:(CFG.volume.at(-1).q||1)*2,d:0}); break;
    case 'sDelVol': CFG.volume.splice(i,1); break;
    case 'sAddLvl': CFG.levels.push({id:'l'+Date.now().toString(36),name:'Новий рівень',d:0}); break;
    case 'sDelLvl': { const l=CFG.levels[i], rest=CFG.levels.filter((x,k)=>k!==i), n=CL.filter(c=>c.level===l.id).length;
      return ask(`Видалити рівень «${l.name}»?${n?` ${n} клієнт(ів) буде переведено на «${rest[0].name}».`:''}`,()=>{ CL.forEach(c=>{ if(c.level===l.id) c.level=rest[0].id; }); CFG.levels.splice(i,1); }); }
    case 'sAddText': TEXTS.push({t:'Новий розділ',where:'info',body:'',photos:[]}); break;
    case 'sDelText': return ask(`Видалити розділ «${TEXTS[i].t}»?`,()=>{ TEXTS.splice(i,1); });
    case 'sDelPh': TEXTS[i].photos.splice(j,1); break;
    case 'sMovePh': { const p=TEXTS[i].photos, k=j+(+d.v); [p[j],p[k]]=[p[k],p[j]]; break; }
    default: return false;
  }
  LCACHE.clear(); rr(); return true;
}
function settingsChange(t){
  const d=t.dataset, s=d.s; if(!s) return false;
  const i=d.i!=null?+d.i:null, j=d.j!=null?+d.j:null, c=CATS[U.scat], v=t.value, n=+v;
  const m=i!=null&&c.mats?c.mats[i]:null, ch=d.key&&i!=null?OPT[d.key].c[i]:null;
  const sizes=()=>c.kind==='stand'?c.vids[Math.min(U.svid||0,c.vids.length-1)].sizes:c.std;
  let redraw=false;
  switch(s){
    case 'cn': c.n=v; break; case 'cd': c.d=v; break; case 'cterms': c.terms=v; break; case 'cshow': c.hidden=!t.checked; break;
    case 'cq': if(t.checked){ if(!c.q.includes(d.k)) c.q.push(d.k); } else c.q=c.q.filter(k=>k!==d.k); break;
    case 'szw': sizes()[i][0]=n; break; case 'szh': sizes()[i][1]=n; break; case 'szp': sizes()[i][2]=n; break;
    case 'szn': { const r=sizes()[i]; if(c.kind==='stand') r[3]=v; else r[2]=v; break; }
    case 'mn': m.n=v; break; case 'mt': m.t=v; break; case 'mna': m.na=t.checked?0:1; redraw=true; break;
    case 'mroll': if(n>0) m.rolls[j]=n; break; case 'msw': if(n>0) m.sheet[0]=n; break; case 'msh': if(n>0) m.sheet[1]=n; break;
    case 'mmargin': if(v==='') delete m.margin; else m.margin=n; break; case 'mcost': m.cost=n||0; break;
    case 'mpr': if(v==='') delete m.pr[d.k]; else m.pr[d.k]=n; break;
    case 'qcat': { const C=CATS[d.cat]; if(t.checked){ if(!C.q.includes(d.k)) C.q.push(d.k); } else { C.q=C.q.filter(x=>x!==d.k); } redraw=true; break; }
    case 'qn': Q[d.k].n=v; break; case 'qt': Q[d.k].t=v; break; case 'qink': INK[d.k]=n||0; break;
    case 'otitle': OPT[d.key].l=v; break; case 'otype': OPT[d.key].t=v; break;
    case 'ol': ch.l=v; break; case 'op': setPrice(ch,unitOf(ch),v); break; case 'ou': setPrice(ch,v,priceOf(ch)); redraw=true; break;
    case 'omin': if(v==='') delete ch.min; else ch.min=n; break;
    case 'ostep': if(n>0) ch.step=n/10; break; case 'oholes': if(n>0) ch.holes=n; break;
    case 'tn': TERMS[d.g][i].n=v; break; case 'ts': TERMS[d.g][i].s=v; break; case 'tk': TERMS[d.g][i].k=n||1; break;
    case 'tv': case 'tu': { const tm=TERMS[d.g][i], u=s==='tu'?v:(tm.hours?'h':'d'), val=s==='tv'?n:(tm.hours||tm.days); delete tm.hours; delete tm.days; tm[u==='h'?'hours':'days']=val||1; break; }
    case 'vq': CFG.volume[i].q=n; break; case 'vd': CFG.volume[i].d=(n||0)/100; break;
    case 'gmarkup': CFG.markup=(n||0)/100; break; case 'gmarginRoll': CFG.marginRoll=n||0; break; case 'gmarginSheet': CFG.marginSheet=n||0; break; case 'gleftoverMin': CFG.leftoverMin=n||0; break;
    case 'gpvhBase': CFG.pvhCut.base=n||0; break; case 'gpvhMm': CFG.pvhCut.perMm=n||0; break;
    case 'ln': CFG.levels[i].name=v; break; case 'ld': CFG.levels[i].d=(n||0)/100; break;
    case 'xt': TEXTS[i].t=v; break; case 'xw': TEXTS[i].where=v; break; case 'xb': TEXTS[i].body=v; break; case 'xcap': TEXTS[i].photos[j].cap=v; break;
    case 'xadd': for(const f of t.files) TEXTS[i].photos.push({src:URL.createObjectURL(f),cap:f.name.replace(/\.[^.]+$/,'')}); redraw=true; break;
    default: return false;
  }
  LCACHE.clear(); if(redraw) rr(); return true;
}

const PAGES={dash:pDash,orders:pOrders,order:pOrder,prepress:pPrepress,production:pProduction,clients:pClients,client:pClient,money:pMoney,settings:pSettings,staff:pStaff};
function go(id){ try{ history.pushState(null,'','#'+id); }catch(e){} route(id); }
function route(id){
  if(id==null) id=location.hash.slice(1)||'dash';
  const [pg,arg]=id.split('/'); U.page=PAGES[pg]?pg:'dash'; U.arg=arg;
  if(U.page!=='orders'&&U.page!=='clients') U.q='';
  closeModal(); render(); window.scrollTo(0,0);
}
function render(){ renderWho(); document.querySelector('.alay').classList.toggle('solo',!ME()); if(!ME()){ $('#side').innerHTML=''; $('#side').style.display='none'; pLogin(); return; } $('#side').style.display=''; renderSide(); PAGES[U.page](U.arg); }
function rr(){ const y=window.scrollY; render(); window.scrollTo(0,y); }
window.addEventListener('popstate',()=>route());

function modal(html){ $('#modalBox').innerHTML=html+`<div style="text-align:right;margin-top:18px"><button class="btn" data-close>Закрити</button></div>`; $('#modal').classList.add('on'); }
function closeModal(){ $('#modal').classList.remove('on'); }
const toast=t=>modal(`<h3>${t}</h3>`);

function setStatus(o,s){
  if(!NEXT[o.st].includes(s)) return;
  const from=o.st; o.st=s; logO(o,`статус «${ST[from][0]}» → «${ST[s][0]}»`);
  const msg={print:'Замовлення передано в друк.',ready:o.deliv==='self'?'Замовлення готове. Забрати можна на складі.':'Замовлення готове й буде відправлене Новою Поштою.',sent:`Замовлення відправлено. ТТН ${o.ttn}.`,cancel:'Замовлення скасовано.',paid:'Макет перевірено, оплату отримано — замовлення в черзі на друк.'}[s];
  if(msg) sendClient(o,s==='ready'||s==='sent'?'Склад':'Менеджер',`№${o.id}: ${msg}`);
}
function payFromBalance(o){ const s=due(o); if(s<=0||bal(o.c)<s) return;
  LEDGER.push({c:o.c,d:new Date(),t:`Оплата замовлення №${o.id}`,s:-s}); o.paid+=s; logO(o,`оплата з балансу ${fmt(s)} грн`);
  sendClient(o,'Бухгалтерія',`Оплату ${fmt(s)} грн за №${o.id} отримано.`);
  if(o.st==='check'&&layoutsOk(o)) setStatus(o,'paid'); }
function releaseOrders(s){ for(const o of ORD) if(o.who===s.id&&open_(o)){ o.who=null; o.log.push({d:new Date(),t:`${short(s.n)} пішов зі зміни — замовлення вільне`}); } }

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-close]')||t.id==='modal'){ closeModal(); return; }
  const ts=t.closest('[data-toast]'); if(ts){ toast(ts.dataset.toast); return; }
  const g=t.closest('[data-go]'); if(g&&!t.closest('[data-act]')){ e.preventDefault(); if(g.dataset.own) U.own=g.dataset.own; go(g.dataset.go); return; }
  const a=t.closest('[data-act]'); if(!a||a.disabled) return;
  if(settingsClick(a)) return;
  const v=a.dataset.v, id=a.dataset.id?+a.dataset.id:null, o=id?ord(id):null;
  switch(a.dataset.act){
    case 'fill': { const s=STAFF.find(x=>x.id===id); $('#lgLogin').value=s.login; $('#lgPass').value=s.pass; return; }
    case 'login': { const l=$('#lgLogin').value.trim().toLowerCase(), p=$('#lgPass').value, s=STAFF.find(x=>x.login===l&&x.pass===p);
      if(!s){ $('#lgErr').textContent='Невірний email або пароль'; return; }
      setMe(s.id); s.online=true; s.seen=new Date(); go('dash'); break; }
    case 'logout': { const s=ME(); if(s){ s.online=false; s.seen=new Date(); releaseOrders(s); } setMe(null); render(); break; }
    case 'period': U.period=+v; rr(); break;
    case 'otab': U.otab=v; rr(); break;
    case 'own': U.own=v; rr(); break;
    case 'take': o.who=meId; logO(o,'взяв(ла) в роботу'); if(U.page==='order') rr(); else go('order/'+id); break;
    case 'shift': { const s=STAFF.find(x=>x.id===id); s.online=!s.online; s.seen=new Date(); if(!s.online) releaseOrders(s); rr(); break; }
    case 'st': if(v==='cancel'){ modal(`<h3>Скасувати №${id}?</h3><p class="muted">Клієнт отримає повідомлення.${o.paid?` Оплачені ${fmt(o.paid)} грн повернуться на баланс клієнта.`:''}</p><button class="btn pri" data-act="doCancel" data-id="${id}">Так, скасувати</button>`); break; }
      setStatus(o,v); rr(); break;
    case 'doCancel': if(o.paid){ LEDGER.push({c:o.c,d:new Date(),t:`Повернення за скасоване №${o.id}`,s:o.paid}); o.paid=0; } setStatus(o,'cancel'); closeModal(); rr(); break;
    case 'fOk': { const f=o.files[+v]; f.st='ok'; logO(o,`макет ${f.n} перевірено`);
      if(layoutsOk(o)){ if(o.st==='fix') o.st='check'; sendClient(o,'Препрес',`Макет для №${o.id} перевірено.`+(isPaid(o)?' Замовлення йде в друк.':' Замовлення піде в друк після оплати.')); if(isPaid(o)&&o.st==='check') setStatus(o,'paid'); }
      rr(); break; }
    case 'fBad': modal(`<h3>Повернути макет на виправлення</h3><p class="muted" style="margin-top:0">${esc(o.files[+v].n)} · №${id}</p>
       <div class="lbl">Причина (клієнт побачить цей текст)</div><textarea class="area" id="badWhy" style="min-height:90px" placeholder="Напр.: шрифти не переведені в криві"></textarea>
       <label class="check" style="margin-top:10px;font-size:13px"><input type="checkbox" id="badRw" checked>Додати в повідомлення посилання «Замовити доопрацювання»</label>
       <div style="margin-top:12px"><button class="btn pri" data-act="doBad" data-id="${id}" data-v="${v}">Повернути клієнту</button></div>`); break;
    case 'doBad': { const why=$('#badWhy').value.trim(); if(!why){ $('#badWhy').focus(); return; } const f=o.files[+v]; f.st='bad'; f.reason=why; o.fixReason=why;
      if(o.st==='check') o.st='fix'; logO(o,`макет ${f.n} повернено: ${why}`);
      sendClient(o,'Препрес',`Макет ${f.n} повернено на виправлення. ${why}`+($('#badRw').checked?' → [Замовити доопрацювання]':''));
      closeModal(); rr(); break; }
    case 'rwSet': { const inp=$('#rwP')||$('#rwP'+id); const p=+inp.value; if(!(p>0)){ inp.focus(); return; }
      o.rework=p; o.reworkReq=false; logO(o,`вартість доопрацювання ${fmt(p)} грн`); sendClient(o,'Препрес',`Вартість доопрацювання макета: ${fmt(p)} грн — додано до замовлення №${o.id}. Після оплати дизайнер підготує макет.`); rr(); break; }
    case 'reply': { const tx=$('#rTx').value.trim(); if(!tx) return; sendClient(o,$('#rFrom').value,tx); logO(o,'надіслано повідомлення клієнту'); rr(); break; }
    case 'ttn': o.ttn=$('#ttn').value.trim(); logO(o,`ТТН ${o.ttn||'видалено'}`); rr(); break;
    case 'payBal': payFromBalance(o); rr(); break;
    case 'demoUp': addFile(o,'maket_vypravlenyi.pdf'); rr(); break;
    case 'mkInv': { const n='СФ-'+(3122+INV.length); INV.unshift({n,c:o.c,d:new Date(),o:[o.id],s:due(o),paid:false}); logO(o,`виставлено рахунок ${n}`); sendClient(o,'Бухгалтерія',`Рахунок ${n} на ${fmt(due(o))} грн — у розділі «Фінанси».`); toast(`Рахунок ${n} виставлено`); rr(); break; }
    case 'invPaid': { const inv=INV[+v]; inv.paid=true; LEDGER.push({c:inv.c,d:new Date(),t:`Оплата за рахунком ${inv.n}`,s:inv.s});
      for(const oid of inv.o){ const x=ord(oid); if(x) payFromBalance(x); } rr(); break; }
    case 'adj': modal(`<h3>Коригування балансу · №${id}</h3><div class="fgrid"><div><div class="lbl">Сума, грн (мінус — списання)</div><input class="inp" id="adjS" type="number"></div><div><div class="lbl">Коментар</div><input class="inp" id="adjT" placeholder="Причина"></div></div><div style="margin-top:12px"><button class="btn pri" data-act="doAdj" data-id="${id}">Провести</button></div>`); break;
    case 'doAdj': { const s=+$('#adjS').value, tx=$('#adjT').value.trim(); if(!s||!tx) return; LEDGER.push({c:id,d:new Date(),t:`Коригування (${short(ME().n)}): ${tx}`,s}); closeModal(); rr(); break; }
    case 'addRole': if(!isOwner()) return; RL.push({id:'r'+Date.now().toString(36),n:'Нова роль',perms:[]}); syncRoles(); rr(); break;
    case 'delRole': { if(!isOwner()) return; const r=roleOf(v), others=RL.filter(x=>!x.fixed&&x.id!==v).sort((a,b)=>a.perms.length-b.perms.length), n=STAFF.filter(x=>x.role===v).length; // переводимо на роль з найменшими правами
      if(!others.length){ toast('Має лишитися хоча б одна роль, крім «Власник».'); return; }
      ask(`Видалити роль «${r.n}»?${n?` ${n} співроб. буде переведено на роль «${others[0].n}».`:''}`,()=>{ STAFF.forEach(x=>{ if(x.role===v) x.role=others[0].id; }); RL=RL.filter(x=>x.id!==v); syncRoles(); }); break; }
    case 'delStaff': { const st=STAFF.find(x=>x.id===id); ask(`Видалити співробітника «${st.n}»? Його незакриті замовлення стануть вільними.`,()=>{ releaseOrders(st); STAFF.splice(STAFF.indexOf(st),1); }); break; }
    case 'delClient': { const cc=cl(id), n=ORD.filter(o=>o.c===id&&open_(o)).length;
      ask(`Видалити клієнта «${cc.n}» (№${id})?${n?` У нього ${n} незакритих замовлень — вони залишаться в CRM.`:''}`,()=>{ CL.splice(CL.indexOf(cc),1); go('clients'); }); break; }
    case 'delInv': { const inv=INV[+v]; ask(`Видалити рахунок ${inv.n}?`,()=>{ INV.splice(+v,1); }); break; }
    case 'addStaff': modal(`<h3>Новий співробітник</h3><div class="fgrid"><div><div class="lbl">Ім’я та прізвище</div><input class="inp" id="sfN"></div><div><div class="lbl">Роль</div><select class="sel" id="sfR" ${isOwner()?'':'disabled title="Роль призначає власник"'}>${RL.filter(r=>!r.fixed).map(r=>`<option value="${r.id}" ${r.id==='manager'?'selected':''}>${esc(r.n)}</option>`).join('')}</select></div>
       <div class="full"><div class="lbl">Email для входу</div><input class="inp" id="sfE" type="email" placeholder="name@example.com"></div></div><p class="muted" style="font-size:13px">Запрошення з посиланням для встановлення пароля прийде на email (у робочій версії).</p><button class="btn pri" data-act="doStaff">Додати</button>`); break;
    case 'doStaff': { const n=$('#sfN').value.trim(); if(!n) return; STAFF.push({id:Math.max(...STAFF.map(s=>s.id))+1,login:($('#sfE').value.trim().toLowerCase()||'new'+Date.now()+'@druk.test'),pass:'welcome123',n,role:$('#sfR').value,online:false,seen:new Date()}); closeModal(); rr(); break; }
  }
});
document.addEventListener('change',e=>{
  const t=e.target, d=t.dataset;
  if(t.id==='asg'){ const o=ord(U.arg); o.who=t.value?+t.value:null; logO(o,o.who?`призначено: ${staffN(o.who)}`:'знято виконавця'); rr(); return; }
  if(t.id==='lvl'){ const c=cl(+d.id); c.level=t.value; rr(); return; }
  if(d.role){ if(!isOwner()) return; STAFF.find(s=>s.id===+d.role).role=t.value; rr(); return; }
  if(d.perm){ if(!isOwner()) return; const r=roleOf(d.roleId); if(r.fixed) return; r.perms=t.checked?[...new Set([...r.perms,d.perm])]:r.perms.filter(x=>x!==d.perm); rr(); return; }
  if(d.rname){ if(!isOwner()) return; const r=roleOf(d.rname); r.n=t.value.trim()||r.n; syncRoles(); rr(); return; }
  if(settingsChange(t)) return;
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='oq'||t.id==='cq'){ U.q=t.value; rr(); const n=$('#'+t.id); n.focus(); n.setSelectionRange(n.value.length,n.value.length); }
  if(t.id==='brandName') $('#brand').textContent=t.value||'Назва';
  if(t.id==='brandColor'){ document.documentElement.style.setProperty('--accent',t.value); document.documentElement.style.setProperty('--accent-2',t.value); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); if(e.key==='Enter'&&['lgLogin','lgPass'].includes(e.target.id)) document.querySelector('[data-act=login]')?.click(); });

route();
</script>
</body>
</html>
