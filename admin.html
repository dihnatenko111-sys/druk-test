<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Адмінка друку</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=14">
<style>
/* ---------- адмінка ---------- */
.atop{display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}
.atop .logo small{font-size:12px;font-weight:600;color:#a5b4fc;margin-left:4px;letter-spacing:.04em;text-transform:uppercase}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:#cbd5e1;flex-wrap:wrap}
.who select{height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;padding:0 10px}
.who select option{color:#111}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.off{background:var(--dis)}
.alay{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;max-width:1360px;margin:0 auto;padding:0 24px}
.alay.solo{grid-template-columns:minmax(0,1fr)}
@media (min-width:1600px){ .alay{max-width:none;padding:0 32px;grid-template-columns:240px minmax(0,1fr)} }
.side{position:sticky;top:16px;align-self:start;margin-top:24px;display:flex;flex-direction:column;gap:2px}
.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--ink);font-weight:500;font-size:14px}
.side a svg{width:18px;height:18px;color:var(--muted)}
.side a:hover{background:var(--card)}
.side a.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
.side a.on svg{color:var(--accent)}
.side a b{margin-left:auto;font-size:11px;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 7px;line-height:18px}
.side .sep{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:14px 12px 4px}
.amain{min-width:0;padding-bottom:40px}
.lay-mini{overflow-x:auto;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
.grp{margin-bottom:16px}
.grp-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.grp-h h2{font-size:17px;margin:0}
.pjob{border-top:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px}
.pjob:first-of-type{border-top:0;padding-top:0}
.pjob .lay-mini{grid-column:1/-1;margin-top:0}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn.sm{height:32px;padding:0 12px;font-size:11.5px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad)}
.btn.bad:hover{border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.lock{font-size:12.5px;color:var(--muted);background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.ed{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--soft);font-variant-numeric:tabular-nums;min-width:64px}
.ed:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--card)}
.tbl td.e{padding:6px 8px}
.tbl.compact td{padding:8px 12px}
.log{font-size:12.5px;color:var(--muted);display:grid;gap:4px}
.log b{color:var(--ink);font-weight:500}
.free{color:var(--amber-fg);font-weight:600;font-size:12.5px}
.cols.narrow{grid-template-columns:minmax(0,1fr) 260px}
.cols.half{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.xb{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;font-size:13px;flex:0 0 30px;display:inline-grid;place-items:center}
.xb:hover{border-color:var(--bad);color:var(--bad)}
.xb[disabled]{opacity:.35;cursor:default;border-color:var(--line);color:var(--muted)}
.hint{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--soft);border:1px solid var(--line);font-size:10px;color:var(--muted);cursor:help;vertical-align:1px}
.mat-h,.opt-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.mat.na{opacity:.7;border-style:dashed}
.mat-g{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:14px}
.dfl{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}.dfl .inp{width:150px}
.totrow td{font-weight:700;background:var(--soft);border-top:2px solid var(--line)}
.rolls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.roll{display:inline-flex;gap:4px;align-items:center}
.ed.w{width:80px;min-width:0}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.qgrid label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.chk{display:flex;flex-wrap:wrap;gap:8px 16px}
.chk .check{font-size:13px}
.pl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}.pl .ed{width:80px}
.ed.ta{height:auto;min-height:52px;padding:6px 8px;resize:vertical;min-width:240px;font-size:13px;line-height:1.4}
select.ed{padding-right:24px;background-position:right 8px center}
.subopt{margin-left:28px;border-left:3px solid var(--accent-soft)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ph{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft);display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--line)}
.ph .ed{border-radius:0;border-width:1px 0;background:var(--card)}
.ph-a{display:flex;gap:6px;padding:6px}
.ph-add{min-height:180px}
.perm td,.perm th{text-align:center}.perm td:first-child,.perm th:first-child{text-align:left}
.perm input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}.perm input:disabled{cursor:default}
.rh{display:flex;gap:4px;align-items:center;justify-content:center}.rh .ed{width:120px;text-transform:none;letter-spacing:0;font-weight:600}
.qcats{display:flex;flex-wrap:wrap;gap:6px;min-width:300px}
.qc{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;cursor:pointer;background:var(--card);color:var(--muted)}
.qc input{width:14px;height:14px;accent-color:var(--accent);margin:0}
.qc.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}
.qc:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px}
.swatch{width:40px;height:32px;border:1px solid var(--line);border-radius:8px;padding:0;background:none;cursor:pointer}
@media (max-width:900px){
  .alay{grid-template-columns:minmax(0,1fr);padding:0 16px}
  .side{position:static;flex-direction:row;overflow-x:auto;margin-top:16px;gap:4px;padding-bottom:4px}
  .side a{white-space:nowrap}
  .side .sep{display:none}
  .atop{padding:12px 16px}
  .who{margin-left:0}
  .cols.narrow,.cols.half{grid-template-columns:minmax(0,1fr)}
  .stats.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mat-g{grid-template-columns:minmax(0,1fr)}
  .subopt{margin-left:0}
}
</style>
</head>
<body>
<header><div class="atop">
  <div class="logo"><i></i><span id="brand">НазваДрук</span><small>адмінка</small></div>
  <div class="who" id="who"></div>
</div></header>
<div class="alay"><nav class="side" id="side"></nav><main class="amain" id="app"></main></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
// нова версія сайту: браузер міг узяти сторінку з кешу — перевіряємо номер збірки й перезавантажуємо
(function(){ var B='14'; if(B.indexOf('__')===0) return; fetch('version.txt?t='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.text():''; }).then(function(v){ v=(v||'').trim(); var u=new URL(location.href);
  if(v&&v!==B&&u.searchParams.get('b')!==v){ u.searchParams.set('b',v); location.replace(u.toString()); } }).catch(function(){}); })();
</script>
<script src="shared.js?v=14"></script>
<script>
/* =====================================================================
   АДМІНКА + CRM. Тестові дані, в пам'яті сторінки.
   ===================================================================== */
const $=s=>document.querySelector(s), app=$('#app');
const dayKey=d=>Math.floor((new Date(d).setHours(0,0,0,0)-new Date(NOW).setHours(0,0,0,0))/DAY);
const ago=d=>{ const m=Math.round((NOW-d)/6e4); return m<60?m+' хв':m<1440?Math.round(m/60)+' год':Math.round(m/1440)+' дн'; };
I.file=sv('<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',1.8);
I.upload=sv('<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v4h16v-4"/>',1.8);
I.dash=sv('<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/>');
I.eye=sv('<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>');
I.users=sv('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .6 3.2 2.4 3.6 5.5"/>');
I.cog=sv('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/>');
I.badge=sv('<rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M8 17c.8-2 2.2-3 4-3s3.2 1 4 3"/>');

/* ---------- ролі й права: власник змінює права, створює й видаляє ролі ---------- */
const PERMS=[['settings','Ціни, матеріали, налаштування'],['levels','Рівні й категорії клієнтів'],['crm','CRM і виробництво'],['cost','Собівартість і маржа'],
  ['allOrders','Усі замовлення','Без цього права — тільки замовлення, взяті в роботу'],['clients','Клієнти'],['prepress','Препрес (перевірка макетів)'],
  ['production','Черга виробництва'],['money','Рахунки й оплати'],['reports','Звіти по замовленнях'],['assign','Призначати замовлення іншим'],['profit','Дашборд «Заробіток»'],['staff','Персонал (додати, видалити співробітника)'],
  ['pay','Змінювати статус оплати','«Оплачено / Не оплачено», списання з балансу, підтвердження рахунку. За ТЗ — тільки бухгалтер'],
  ['credit','Друк без оплати','Тільки з обов’язковою датою оплати; у цю дату — нагадування'],
  ['behalf','Створювати клієнтів і замовлення від їх імені'],['delivery','Додавати доставку в замовлення'],['rework','Доопрацювання макета й ціна доопрацювання']];
// дані — зі спільного сховища (shared.js); сайт клієнта бачить ті самі замовлення, клієнтів і ціни
let DB,ORD,CL,LEDGER,INV,STAFF,RL,TEXTS,INK;
const ROLES={}; function syncRoles(){ for(const k in ROLES) delete ROLES[k]; RL.forEach(r=>{ ROLES[r.id]=r.n; }); }
function bind(){ DB=loadDB(); ORD=DB.orders; CL=DB.clients; LEDGER=DB.ledger; INV=DB.inv; STAFF=DB.staff; RL=DB.roles; TEXTS=DB.texts; INK=DB.ink; syncRoles(); }
function persist(){ Object.assign(DB,{orders:ORD,clients:CL,ledger:LEDGER,inv:INV,staff:STAFF,roles:RL,texts:TEXTS,ink:INK}); saveDB(DB,true); }
bind();
const roleOf=id=>RL.find(r=>r.id===id);
const can=k=>{ const m=ME(), r=m&&roleOf(m.role); return !!r&&(!!r.fixed||r.perms.includes(k)); };
const isOwner=()=>!!ME()&&ME().role==='owner';

// вхід: у тестовій версії перевірка в браузері; у робочій версії — на сервері
let meId=null; try{ meId=+sessionStorage.getItem('staff_id')||null; }catch(e){}
function setMe(id){ meId=id; try{ id?sessionStorage.setItem('staff_id',id):sessionStorage.removeItem('staff_id'); }catch(e){} }
const ME=()=>STAFF.find(s=>s.id===meId);
const staffN=id=>{ const s=STAFF.find(x=>x.id===id); return s?s.n:'—'; };
const short=n=>{ const [a,b]=n.split(' '); return a+' '+(b?b[0]+'.':''); };

/* ---------- собівартість друку (фарба, знос), грн/м² — нове поле для адмінки ---------- */

/* ---------- клієнти ---------- */
const cl=id=>CL.find(c=>c.id===id)||{id,n:'Видалений клієнт',ph:'—',em:'—',type:'person',co:'',level:CFG.levels[0].id,since:new Date(),deleted:1};
const bal=c=>LEDGER.filter(x=>x.c===c).reduce((a,x)=>a+x.s,0);

/* ---------- замовлення ---------- */
const ST={new:['Нове','gray'],check:['Перевірка макета','amber'],fix:['На виправленні','red'],paid:['Черга друку','blue'],print:['У друці','indigo'],ready:['Готово','green'],sent:['Відправлено','cyan'],done:['Виконано','gray'],cancel:['Скасовано','gray']};
// дозволені переходи статусів
const NEXT={new:['check','cancel'],check:['fix','paid','cancel'],fix:['check','cancel'],paid:['print'],print:['ready'],ready:['sent','done'],sent:['done'],done:[],cancel:[]};
const badge=st=>`<span class="badge b-${ST[st][1]}">${ST[st][0]}</span>`;

// сума за прайсом: друк + відхід (або фіксована ціна формату)
const ord=id=>ORD.find(o=>o.id==id);
// рух коштів і рахунки — за фактичними сумами замовлень
const due=o=>Math.max(0,oTotal(o)-o.paid);
const isPaid=o=>due(o)<.005;
const open_=o=>!['done','cancel'].includes(o.st);
// перевірка макета (як у Jira): менеджер призначає дизайнера, дизайнер веде статус
const RV={none:['Не призначено','gray'],todo:['До перевірки','amber'],doing:['Перевіряється','blue'],ok:['Перевірено','green'],bad:['Повернено','red']};
const rvBadge=k=>`<span class="badge b-${RV[k||'none'][1]}">${RV[k||'none'][0]}</span>`;
// борг = замовлення пішло в друк без оплати і ще не оплачене
const isDebt=o=>o.st!=='cancel'&&!!o.credit&&due(o)>0.005;
const debtsOf=cid=>ORD.filter(o=>o.c===cid&&isDebt(o));
const ccatOf=c=>CFG.ccats.find(x=>x.id===c.cat)||CFG.ccats[0];
const payBadge=o=>o.st==='cancel'?'—':isPaid(o)?'<span class="badge b-green">Оплачено</span>':o.credit?`<span class="badge b-red" title="Друк без оплати">Борг · до ${dstr(o.credit.date)}</span>`:o.paid?'<span class="badge b-amber">Частково</span>':'<span class="badge b-gray">Не оплачено</span>';
// нагадування про оплату — за налаштуваннями (увімкнено, заздалегідь за N днів, у день оплати, прострочені)
function reminders(){ const R=CFG.remind; if(!R||!R.on) return [];
  return ORD.filter(isDebt).filter(o=>can('allOrders')||o.who===meId).map(o=>({o,d:dayKey(o.credit.date)})).filter(x=>(x.d===0&&R.onDay)||(x.d<0&&R.overdue)||(x.d>0&&x.d<=R.every)).sort((a,b)=>a.d-b.d); }
const remTxt=d=>d<0?`<span class="badge b-red">прострочено ${-d} дн.</span>`:d===0?'<span class="badge b-amber">сьогодні</span>':`через ${d} дн.`;
// макети готові: є хоч один, і всі актуальні (не замінені новими) перевірені
const layoutsOk=o=>filesOk(o.files);
// клієнт завантажив новий макет — повернені стають «замінено»
function addFile(o,n){ o.files.forEach(f=>{ if(f.st==='bad') f.st='old'; }); o.files.push({n,st:'wait',at:new Date()}); if(o.st==='fix') o.st='check'; o.log.push({d:new Date(),t:`Клієнт завантажив макет ${n}`}); }
const matOf=o=>o.mat||CATS[o.cat].mats[o.mi];
// назви якостей на момент створення — щоб старі замовлення не ламались після видалення якості
const QN0=Object.fromEntries(Object.entries(Q).map(([k,q])=>[k,plain(q.n)]));
const qName=k=>Q[k]?plain(Q[k].n):(QN0[k]||k);
function lay(o){ // внутрішня розкладка: розміри в см, тираж × комплекти
  const c=o.cat==='stands'?CATS.banner:CATS[o.cat];
  return layout(c,matOf(o),o.sizes&&o.sizes.length?o.sizes.map(z=>({w:z.w/10,h:z.h/10})):[{w:o.w/10,h:o.h/10}],o.tir*o.kits,{pw:o.pwm||'p'});
}
function costOf(o){
  const L=lay(o), m=matOf(o); if(!L) return null;
  const material=L.used*m.cost, ink=L.printArea*(INK[o.qk]||0), waste=Math.max(0,L.used-L.printArea);
  const extra=0;
  const cost=material+ink+extra;
  return {L,material,ink,extra,waste,cost,margin:o.sum+o.rework-cost};
}
function logO(o,t){ o.log.push({d:new Date(),t:`${short(ME().n)}: ${t}`}); }
function sendClient(o,from,t,x){ (o.thread=o.thread||[]).push({d:new Date(),from,t,...x}); } // клієнт бачить це в «Листуванні»

/* ---------- стан інтерфейсу ---------- */
const U={page:'dash',arg:'',otab:'act',own:'all',q:'',period:30,stab:'cats',scat:'banner',svid:0,ctab:'all',df:'',dt:'',rst:'all',oview:'board',fMgr:'',fDes:'',fRv:'',fPay:'',fSum:'',fPd:'',fSt:'',combo:false,nm:false};

/* ---------- шапка й меню ---------- */
function renderWho(){
  const me=ME(); if(!me){ $('#who').innerHTML=''; return; }
  $('#who').innerHTML=`<span><span class="dot ${me.online?'':'off'}"></span> ${me.online?'На зміні':'Не на зміні'}</span>
   <span><b style="color:#fff">${esc(me.n)}</b> · ${ROLES[me.role]}</span>
   <a href="calculator.html" style="color:#a5b4fc">Сайт клієнта →</a><button class="btn sm" data-act="logout" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.25)">Вийти</button>`;
}
function pLogin(){
  app.innerHTML=`<div class="auth" style="margin-top:40px"><div class="card" style="padding:28px"><h2 style="margin:0 0 4px;font-size:20px">Вхід для співробітників</h2><p class="muted" style="margin:0 0 18px;font-size:13px">Адмінка й CRM</p>
   <div style="display:grid;gap:12px"><div><div class="lbl">Email</div><input class="inp" id="lgLogin" autocomplete="username"></div>
    <div><div class="lbl">Пароль</div><input class="inp" id="lgPass" type="password" autocomplete="current-password"></div>
    <div id="lgErr" style="color:var(--bad);font-size:13px;min-height:18px"></div><button class="btn pri" style="height:44px" data-act="login">Увійти</button></div></div>
   <div class="card" style="font-size:13px;border-style:dashed"><b>Тестові доступи</b> <span class="muted">(натисніть рядок, щоб підставити)</span>
    <table class="tbl compact" style="min-width:0;margin-top:8px"><tbody>${STAFF.map(s=>`<tr class="row" data-act="fill" data-id="${s.id}"><td>${ROLES[s.role]}<small>${esc(short(s.n))}</small></td><td>${s.login}<small>${s.pass}</small></td></tr>`).join('')}</tbody></table>
    <div class="muted" style="margin-top:6px">Тестова версія: дані зберігаються в цьому браузері.</div></div></div>`;
}
// розділ «Замовлення» (CRM) — не для друкаря: йому достатньо виробничої дошки
const seesOrders=()=>can('allOrders')||can('prepress')||can('clients')||can('money')||can('credit');
function visibleOrders(){ return ORD.filter(o=>can('allOrders')||o.who===meId||o.des===meId); }
function renderSide(){

   ===================================================================== */
function pDash(){
  const work=visibleOrders().filter(o=>['new','check','fix','paid','print'].includes(o.st));
  const m2=o=>{ const L=lay(o); return L?L.printArea:0; };
  const buckets=[['Прострочені',o=>dayKey(o.ready)<0],['Сьогодні',o=>dayKey(o.ready)===0],['Завтра',o=>dayKey(o.ready)===1],['Пізніше',o=>dayKey(o.ready)>1]];
  const byStatus=['new','check','fix','paid','print'].map(s=>[s,work.filter(o=>o.st===s)]);
  const rem=(can('pay')||can('credit')||can('money'))?reminders():[];
  let h=pageH('Дашборд',`<span class="muted" style="font-size:13px">${dstr(NOW)}, ${WD[NOW.getDay()]}</span>`)+
  (rem.length?`<div class="card flush remind"><div class="bar"><b>Нагадування про оплату</b><span class="muted" style="font-size:13px">друк без оплати · ${fmt(rem.reduce((a,x)=>a+due(x.o),0))} грн</span></div><div class="tbl-wrap"><table class="tbl compact" style="min-width:560px"><thead><tr><th>Замовлення</th><th>Клієнт</th><th>Дата оплати</th><th class="r">Борг</th><th>Менеджер</th></tr></thead><tbody>
    ${rem.map(({o,d})=>`<tr class="row" data-go="order/${o.id}"><td><b>№${o.id}</b><small>${badge(o.st)}</small></td><td>${esc(cl(o.c).n)}<small>${cl(o.c).ph}</small></td><td>${dstr(o.credit.date)}<small>${remTxt(d)}</small></td><td class="r"><b style="color:var(--bad)">${fmt(due(o))}</b></td><td>${o.who?short(staffN(o.who)):'—'}</td></tr>`).join('')}</tbody></table></div></div>`:'')+
  `<div class="stats four">
    <div class="stat"><div class="k">У роботі</div><div class="v">${work.length}</div><div class="s">замовлень до друку включно</div></div>
    <div class="stat"><div class="k">Площа друку</div><div class="v">${fmt1(work.reduce((a,o)=>a+m2(o),0))} <small>м²</small></div><div class="s">у роботі</div></div>
    <div class="stat"><div class="k">Без виконавця</div><div class="v">${work.filter(o=>!o.who).length}</div><div class="s">${seesOrders()?'<a data-go="orders" data-own="free">Відкрити вільні</a>':''}</div></div>
    <div class="stat"><div class="k">Макетів на перевірці</div><div class="v">${prepQueue().length}</div><div class="s"><a data-go="prepress">До препресу</a></div></div></div>
  <div class="cols half">
   <div class="card flush"><div class="bar"><b>Завантаженість за датою готовності</b></div><div class="tbl-wrap"><table class="tbl compact" style="min-width:420px"><thead><tr><th>Готовність</th><th class="r">Замовлень</th><th class="r">м² друку</th><th>Номери</th></tr></thead><tbody>
    ${buckets.map(([n,f])=>{ const l=work.filter(f); return `<tr><td>${n==='Прострочені'&&l.length?`<span class="badge b-red">${n}</span>`:n}</td><td class="r">${l.length}</td><td class="r">${fmt1(l.reduce((a,o)=>a+m2(o),0))}</td><td>${l.map(o=>`<a data-go="order/${o.id}">${o.id}</a>`).join(', ')||'—'}</td></tr>`; }).join('')}</tbody></table></div></div>
   <div class="card flush"><div class="bar"><b>За статусами</b></div><div class="tbl-wrap"><table class="tbl compact" style="min-width:380px"><thead><tr><th>Статус</th><th class="r">Замовлень</th><th class="r">м²</th></tr></thead><tbody>
    ${byStatus.map(([s,l])=>`<tr><td>${badge(s)}</td><td class="r">${l.length}</td><td class="r">${fmt1(l.reduce((a,o)=>a+m2(o),0))}</td></tr>`).join('')}</tbody></table></div></div></div>`;
  if(can('profit')){
    const from=dt(-U.period,0), done=ORD.filter(o=>['ready','sent','done'].includes(o.st)&&o.ready>=from);
    const rows={}; let rev=0,cost=0;
    for(const o of done){ const c=costOf(o); const r=o.sum+o.rework; rev+=r; cost+=c?c.cost:0;
      const k=CATS[o.cat].n; rows[k]=rows[k]||{n:0,rev:0,cost:0}; rows[k].n++; rows[k].rev+=r; rows[k].cost+=c?c.cost:0; }
    h+=`<div class="page-h" style="margin-top:8px"><h1 style="font-size:19px">Заробіток <span class="badge b-indigo">тільки власник</span></h1>
      <div class="seg" style="margin:0">${[[7,'7 днів'],[30,'30 днів'],[90,'90 днів']].map(([d,n])=>`<a class="${U.period===d?'on':''}" data-act="period" data-v="${d}">${n}</a>`).join('')}</div></div>
     <div class="stats"><div class="stat"><div class="k">Виручка</div><div class="v">${fmt(rev)} <small>грн</small></div><div class="s">${done.length} готових замовлень</div></div>
      <div class="stat"><div class="k">Собівартість</div><div class="v">${fmt(cost)} <small>грн</small></div><div class="s">матеріал з обрізком + друк + конструкції</div></div>
      <div class="stat"><div class="k">Прибуток</div><div class="v" style="color:var(--ok)">${fmt(rev-cost)} <small>грн</small></div><div class="s">маржа ${rev?fmt1((rev-cost)/rev*100):0}%</div></div></div>
     <div class="card flush"><div class="tbl-wrap"><table class="tbl compact" style="min-width:520px"><thead><tr><th>Категорія</th><th class="r">Замовлень</th><th class="r">Виручка</th><th class="r">Собівартість</th><th class="r">Прибуток</th></tr></thead><tbody>
      ${Object.entries(rows).map(([k,r])=>`<tr><td>${k}</td><td class="r">${r.n}</td><td class="r">${fmt(r.rev)}</td><td class="r">${fmt(r.cost)}</td><td class="r"><b>${fmt(r.rev-r.cost)}</b></td></tr>`).join('')||'<tr><td colspan="5" class="none">За період готових замовлень немає</td></tr>'}</tbody></table></div></div>`;
  }
  if(can('reports')) h+=`<div class="page-h" style="margin-top:8px"><h1 style="font-size:19px">Звіт по останніх замовленнях</h1><div class="acts"><a class="btn" data-go="reports">Усі звіти →</a></div></div><div class="card flush">${reportTable(visibleOrders().slice().sort((a,b)=>b.d-a.d).slice(0,8),true)}</div>`;
  app.innerHTML=h;
}

/* ---------- спільний фільтр за датою створення ---------- */
const dkey=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const inDates=o=>(!U.df||dkey(o.d)>=U.df)&&(!U.dt||dkey(o.d)<=U.dt);
const dateFilter=()=>`<label class="dfl">з <input class="inp" type="date" id="fDf" value="${U.df}"></label><label class="dfl">по <input class="inp" type="date" id="fDt" value="${U.dt}"></label>${U.df||U.dt||U.q?'<button class="btn sm" data-act="fClear">Скинути</button>':''}`;

/* ---------- звіт по одному замовленню ---------- */
function orderReport(o){
  const k=costOf(o), m=matOf(o), C=CATS[o.cat], total=oTotal(o);
  const fx=C.fixed&&m.fx&&m.fx[o.w+'x'+o.h], fixed=fx&&fx[o.qk]!=null;
  const printRev=fixed?fx[o.qk]*o.tir*o.kits:(k?k.L.printArea*(m.pr[o.qk]||0):0), wasteRev=fixed||!k?0:k.waste*(m.waste??m.cost);
  return {k,total,fixed,printRev,wasteRev,other:Math.max(0,o.sum-printRev-wasteRev),area:k?k.L.printArea:0,waste:k?k.waste:0,used:k?k.L.used:0,
    cost:k?k.cost:0,profit:k?total-k.cost:0,due:o.st==='cancel'?0:due(o)};
}
function reportCard(o){
  const r=orderReport(o), m=matOf(o), cst=can('cost');
  return `<div class="card"><div class="card-h"><h2>Звіт по замовленню</h2></div><table class="sum" style="font-size:13.5px">
    ${r.fixed?`<tr><td>Формат ${o.w}×${o.h} мм × ${o.tir*o.kits} шт</td><td>${fmt(r.printRev)}</td></tr>`
      :`<tr><td>Друк ${fmt1(r.area)} м² × ${m.pr[o.qk]??0}</td><td>${fmt(r.printRev)}</td></tr><tr><td>Відхід ${fmt1(r.waste)} м² × ${m.waste??m.cost}</td><td>${fmt(r.wasteRev)}</td></tr>`}
    ${r.other>0.005?`<tr><td>Додаткові послуги</td><td>${fmt(r.other)}</td></tr>`:''}${o.rework?`<tr><td>Доопрацювання макета</td><td>${fmt(o.rework)}</td></tr>`:''}${o.dlv?`<tr><td>Доставка (окремо)</td><td>${fmt(o.dlv)}</td></tr>`:''}
    <tr class="tot"><td>Виручка</td><td>${fmt(r.total)}</td></tr><tr><td>Оплачено</td><td>${fmt(o.paid)}</td></tr><tr class="due"><td>Борг клієнта</td><td>${fmt(r.due)}</td></tr>
    ${cst?`<tr><td style="padding-top:12px">Матеріал ${fmt1(r.used)} м² (з відходом)</td><td style="padding-top:12px">${fmt(r.k?r.k.material:0)}</td></tr><tr><td>Друк (фарба, знос)</td><td>${fmt(r.k?r.k.ink:0)}</td></tr>
      <tr class="tot"><td>Собівартість</td><td>${fmt(r.cost)}</td></tr><tr><td>Прибуток</td><td style="color:var(--ok);font-weight:700">${fmt(r.profit)} · ${r.total?fmt1(r.profit/r.total*100):0}%</td></tr>`:''}
   </table><div class="log" style="margin-top:12px"><div>Створено: <b>${dstr(o.d)} ${tstr(o.d)}</b></div><div>Готовність: <b>${dstr(o.ready)}</b></div><div>Менеджер: <b>${o.who?staffN(o.who):'—'}</b></div><div>Дизайнер: <b>${o.des?staffN(o.des):'—'}</b></div></div></div>`;
}

   ЗВІТИ

function reportRows(){
  const q=U.q.trim().toLowerCase();
  return visibleOrders().filter(inDates).filter(o=>U.rst==='all'||(U.rst==='open'?open_(o):U.rst==='closed'?['ready','sent','done'].includes(o.st):o.st===U.rst))
    .filter(o=>!q||String(o.id).includes(q)||cl(o.c).n.toLowerCase().includes(q)||o.name.toLowerCase().includes(q)||String(o.c).includes(q)).sort((a,b)=>b.d-a.d);
}
function reportTable(list,compact){
  const cst=can('cost'), rs=list.map(o=>({o,r:orderReport(o)})), live=rs.filter(x=>x.o.st!=='cancel');
  const T=k=>live.reduce((a,x)=>a+x.r[k],0), paid=live.reduce((a,x)=>a+x.o.paid,0);
  return `<div class="tbl-wrap"><table class="tbl compact" style="min-width:${compact?640:1080}px"><thead><tr><th>№ / дата</th><th>Клієнт</th>${compact?'':'<th>Продукт</th><th class="r">Друк, м²</th><th class="r">Відхід, м²</th><th class="r">Друк, грн</th><th class="r">Доставка</th>'}<th class="r">Сума</th><th class="r">Оплачено</th><th class="r">Борг</th>${cst?'<th class="r">Собівартість</th><th class="r">Прибуток</th>'+(compact?'':'<th class="r">Маржа</th>'):''}<th>Статус</th>${compact?'':'<th>Виконавець</th>'}</tr></thead><tbody>
   ${rs.map(({o,r})=>`<tr class="row" data-go="order/${o.id}"><td><b>${o.id}</b><small>${dstr(o.d)}</small></td><td>${esc(cl(o.c).n)}</td>${compact?'':`<td>${CATS[o.cat].n}<small>${o.name}</small></td><td class="r">${fmt1(r.area)}</td><td class="r">${fmt1(r.waste)}</td><td class="r">${fmt(o.sum+o.rework)}</td><td class="r">${o.dlv?fmt(o.dlv):'—'}</td>`}
     <td class="r">${fmt(r.total)}</td><td class="r">${fmt(o.paid)}</td><td class="r">${r.due>0.005?`<b style="color:var(--bad)">${fmt(r.due)}</b>`:'—'}</td>${cst?`<td class="r">${fmt(r.cost)}</td><td class="r"><b>${fmt(r.profit)}</b></td>`+(compact?'':`<td class="r">${r.total?fmt1(r.profit/r.total*100):0}%</td>`):''}
     <td>${badge(o.st)}</td>${compact?'':`<td>${o.who?short(staffN(o.who)):'—'}</td>`}</tr>`).join('')||`<tr><td colspan="13" class="none">Немає замовлень за цими умовами</td></tr>`}</tbody>
   ${rs.length?`<tfoot><tr class="totrow"><td colspan="${compact?2:3}">Разом (без скасованих): ${live.length}</td>${compact?'':`<td class="r">${fmt1(T('area'))}</td><td class="r">${fmt1(T('waste'))}</td><td class="r">${fmt(live.reduce((a,x)=>a+x.o.sum+x.o.rework,0))}</td><td class="r">${fmt(live.reduce((a,x)=>a+(x.o.dlv||0),0))}</td>`}<td class="r">${fmt(T('total'))}</td><td class="r">${fmt(paid)}</td><td class="r">${fmt(T('due'))}</td>${cst?`<td class="r">${fmt(T('cost'))}</td><td class="r">${fmt(T('profit'))}</td>`+(compact?'':`<td class="r">${T('total')?fmt1(T('profit')/T('total')*100):0}%</td>`):''}<td colspan="2"></td></tr></tfoot>`:''}</table></div>`;
}
function pReports(){
  if(!can('reports')){ app.innerHTML=noAccess(); return; }
  const list=reportRows();
  app.innerHTML=pageH('Звіти по замовленнях',`<button class="btn" data-act="repCsv">Завантажити CSV</button>`)+
  `<div class="card flush"><div class="bar"><input class="inp" id="oq" placeholder="№ замовлення, клієнт, матеріал" value="${esc(U.q)}" style="max-width:260px">${dateFilter()}
    <select class="sel" id="fSt" style="width:190px;height:38px">${[['all','Усі статуси'],['open','Незакриті'],['closed','Готові й виконані'],...Object.entries(ST).map(([k,v])=>[k,v[0]])].map(([k,n])=>`<option value="${k}" ${U.rst===k?'selected':''}>${n}</option>`).join('')}</select></div>
   ${reportTable(list)}</div>
  <p class="foot-note">Дата у фільтрі — дата створення замовлення. Собівартість = матеріал з відходом + друк; значення собівартості задаються в «Налаштуваннях».</p>`;
}
function reportCsv(){
  const cst=can('cost'), rows=[['№','Дата','Клієнт','№ клієнта','Категорія','Матеріал','Друк','Розмір, мм','Тираж','Друк, м²','Відхід, м²','Друк, грн','Доставка, грн','Сума','Оплачено','Борг',...(cst?['Собівартість','Прибуток']:[]),'Статус','Виконавець']];
  for(const o of reportRows()){ const r=orderReport(o), n=x=>String(Math.round(x*100)/100).replace('.',',');
    rows.push([o.id,dstr(o.d),cl(o.c).n,o.c,CATS[o.cat].n,o.name,qName(o.qk),o.w+'×'+o.h,o.tir*o.kits,n(r.area),n(r.waste),n(o.sum+o.rework),n(o.dlv||0),n(r.total),n(o.paid),n(r.due),...(cst?[n(r.cost),n(r.profit)]:[]),ST[o.st][0],o.who?staffN(o.who):'']); }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n')],{type:'text/csv;charset=utf-8'})); a.download='zvit-zamovlennia.csv'; a.click();

const OT=[['act','Активні',o=>open_(o)],['new','Нові',o=>o.st==='new'],['check','Перевірка макета',o=>o.st==='check'],['fix','На виправленні',o=>o.st==='fix'],

// перенесення картки на CRM-дошці
function moveCrm(o,k){
  if(k==='unpaid'||k===o.st) return;
  if(k==='print'||k==='ready'){ toast('«У друці» і «Готово» ставить друкар на виробничій дошці.'); return; }
  if(!NEXT[o.st].includes(k)){ toast(`З «${ST[o.st][0]}» не можна перейти в «${ST[k][0]}».`); return; }
  if(k==='paid'){ if(!layoutsOk(o)){ toast('Не всі макети перевірені.'); return; }
    if(!isPaid(o)&&!o.credit){ if(can('credit')){ creditModal(o); return; } toast('Замовлення не оплачене. Статус оплати змінює бухгалтер, у друк без оплати пускає менеджер.'); return; } }
  if(k==='sent'&&!o.ttn){ toast('Спочатку вкажіть ТТН у картці замовлення.'); return; }
  setStatus(o,k); persist(); rr();
}

const MON=['01','02','03','04','05','06','07','08','09','10','11','12'];

  return `${o.id}_${String(i+1).padStart(2,'0')}_${safe(o.name)}_${o.w}x${o.h}мм_${safe(qName(o.qk))}_${o.tir*o.kits}шт${ext}`; };
const PRINT_ROOT='D:\\Друк', DES_ROOT='D:\\Макети';
function diskCard(o){
  const pr=['paid','print','ready','sent','done'].includes(o.st), ds=!!o.des;

  if(!(pr&&can('production'))&&!(ds&&can('prepress'))) return issue;
  const fs=o.files.map((f,i)=>({f,i})).filter(x=>x.f.st==='ok');
  const block=(who,root)=>`<div class="disk"><div class="disk-h">${I.file}<b>${who}</b><span class="badge b-green">синхронізовано</span></div><code>${esc(diskDir(o,root))}\\</code>
    ${fs.map(({f,i})=>`<div class="disk-f"><span>${esc(diskName(o,f,i))}</span>

  return `<div class="card"><div class="card-h"><h2>Файли на диску</h2><span class="muted" style="font-size:12px">агент друку · Windows</span></div>
   ${issue}
   ${pr&&o.qAt?block('ПК друкаря',PRINT_ROOT):''}${ds?block('ПК дизайнера',DES_ROOT):''}
   ${pr&&!o.qAt?'<span class="muted" style="font-size:13px">Папка створиться, щойно замовлення потрапить у «Чергу друку».</span>':''}

const UNITS=[['none','без доплати'],['piece','грн за 1 виріб'],['area','грн за 1 м² виробу'],['perim','грн за 1 м пог. периметра'],['perimCm','грн за 1 см периметра'],
  ['pocket','грн за 1 м пог. кишені'],['eyelet','грн за 1 люверс'],['hole','грн за 1 отвір'],['cutline','грн за 1 м пог. лінії порізки'],['k','× множник до ціни друку'],['perimTh','× до тарифу порізки ПВХ']];
const PRICE_KEYS=['p','per','k','ep','pm','hp','x'];
function unitOf(ch){ if(ch.k!=null) return 'k'; if(ch.ep!=null) return 'eyelet'; if(ch.pm!=null) return 'cutline'; if(ch.holes!=null) return 'hole'; return ch.per||'none'; }
function priceOf(ch){ return {k:ch.k,eyelet:ch.ep,cutline:ch.pm,hole:ch.hp??4,perimTh:ch.x??1,none:''}[unitOf(ch)] ?? ch.p ?? ''; }
function setPrice(ch,u,val){
  const holes=ch.holes; PRICE_KEYS.forEach(k=>delete ch[k]); const v=val===''||val==null||isNaN(+val)?null:+val;
  if(u==='k') ch.k=v??1; else if(u==='eyelet') ch.ep=v??0; else if(u==='cutline') ch.pm=v??0;
  else if(u==='hole'){ ch.hp=v??0; ch.holes=holes??1; } else if(u==='perimTh'){ ch.per='perimTh'; ch.x=v??1; }
  else if(u!=='none'){ ch.per=u; ch.p=v??0; }
  if(u!=='hole') delete ch.holes;
}

function sOpts(){
  const c=CATS[U.scat];

  return catSeg()+`<div class="alert info" style="font-size:13px">Кожен варіант має <b>ціну</b> і <b>за що</b> вона береться. Наприклад: порізка — «2 грн за 1 м пог. периметра», люверс — «2,4 грн за 1 люверс». <b>Мінімум</b> — найменша сума за опцію на замовлення.</div>`+
  (c.opts||[]).map(key=>{ const op=OPT[key]; if(!op) return '';
    if(!op.c) return `<div class="card"><div class="opt-h"><b>${esc(op.l)}</b><span class="muted">— поле вводу для клієнта, ціна в підопції нижче</span></div></div>`;
    const also=usedIn(key);
    return `<div class="card ${op.sub?'subopt':''}"><div class="opt-h"><input class="inp" data-s="otitle" data-key="${key}" value="${esc(op.l)}" style="font-weight:600;max-width:340px">
      ${op.sub?'<span class="badge b-gray">підопція</span>':''}<select class="sel" data-s="otype" data-key="${key}" style="width:150px">${[['select','Список'],['chips','Кнопки']].map(([v,n])=>`<option value="${v}" ${op.t===v?'selected':''}>${n}</option>`).join('')}</select>
      <span class="grow"></span>${delBtn('sDelOpt',`data-key="${key}"`,'Прибрати опцію з категорії')}</div>
     ${OPT_HINT[key]?`<p class="muted" style="font-size:12.5px;margin:0 0 10px">${OPT_HINT[key]}</p>`:''}${also.length?`<p class="muted" style="font-size:12.5px;margin:0 0 10px">Ця опція також у: ${also.join(', ')} — зміни діють і там.</p>`:''}
     <div class="tbl-wrap"><table class="tbl compact" style="min-width:960px"><thead><tr><th>Варіант (як бачить клієнт)</th><th style="width:110px">Ціна</th><th style="width:230px">За що</th><th style="width:110px">Мінімум, грн</th><th>Параметр</th><th style="width:40px"></th></tr></thead><tbody>
      ${op.c.map((ch,i)=>{ const u=unitOf(ch); return `<tr><td class="e"><input class="ed" data-s="ol" data-key="${key}" data-i="${i}" value="${esc(ch.l)}" style="min-width:240px"></td>
       <td class="e"><input class="ed" type="number" step="0.01" data-s="op" data-key="${key}" data-i="${i}" value="${priceOf(ch)}" ${u==='none'?'disabled placeholder="—"':''}></td>
       <td class="e"><select class="sel ed" data-s="ou" data-key="${key}" data-i="${i}">${UNITS.filter(([v])=>v!=='hole'||ch.holes!=null||key==='holePos').map(([v,n])=>`<option value="${v}" ${u===v?'selected':''}>${n}</option>`).join('')}</select></td>
       <td class="e"><input class="ed" type="number" data-s="omin" data-key="${key}" data-i="${i}" value="${ch.min??''}" placeholder="—" ${u==='none'||u==='k'?'disabled':''}></td>
       <td class="e">${paramCell(key,ch,i)}</td><td class="e">${op.c.length>1?delBtn('sDelVar',`data-key="${key}" data-i="${i}"`,'Видалити варіант'):'<button class="xb" disabled title="Має лишитися хоча б один варіант">✕</button>'}</td></tr>`; }).join('')}</tbody></table></div>
     <button class="btn sm" data-act="sAddVar" data-key="${key}" style="margin-top:10px">+ Варіант</button></div>`; }).join('')+

}

   ${row('Пропайка швів при друці частинами, грн/м пог.','gseam',CFG.seam??80,'Для виробів, ширших за рулон.')}

   ${row('Поле під друк для рулонів, мм з кожного боку','gmarginRoll',CFG.marginRoll*10,'Зазор навколо кожного виробу на рулоні. Можна змінити для окремого матеріалу.',0.5)}

   ${row('Порізка ПВХ: базовий тариф, грн/м пог.','gpvhBase',CFG.pvhCut.base,'Для ПВХ 1 мм.',0.01)}

// фото зменшуємо перед збереженням, щоб вмістилось у сховище
function shrinkImg(file){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,800/Math.max(img.width,img.height)), c=document.createElement('canvas');
  c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.72)); URL.revokeObjectURL(img.src); }; img.src=URL.createObjectURL(file); }); }
/* --- дії налаштувань --- */
let PENDING=null;
function ask(text,fn){ PENDING=fn; modal(`<h3>${esc(text)}</h3><p class="muted" style="margin-top:0">Дію не можна скасувати.</p><button class="btn pri" data-act="sYes">Так, видалити</button>`); return true; }
function settingsClick(a){
  const d=a.dataset, i=d.i!=null?+d.i:null, j=d.j!=null?+d.j:null, c=CATS[U.scat];
  const sizes=()=>c.kind==='stand'?c.vids[Math.min(U.svid||0,c.vids.length-1)].sizes:c.std;
  switch(d.act){
    case 'sYes': { const f=PENDING; PENDING=null; closeModal(); if(f) f(); break; }
    case 'stab': U.stab=d.v; break;
    case 'scat': U.scat=d.v; U.svid=0; break;
    case 'svid': U.svid=+d.v; break;
    case 'sAddCat': { const key='c'+Date.now().toString(36); CATS[key]={n:'Нова категорія',d:'',kind:'roll',ico:'banner',terms:'std',big:'parts',std:[[1000,1000]],q:['q720'],
      mats:[{n:'Новий матеріал',t:'',rolls:[160],cost:0,pr:{q720:0}}],opts:[]}; ORDER.splice(ORDER.length,0,key); U.scat=key; break; }
    case 'sDelCat': { const id=U.scat, n=ORD.filter(o=>o.cat===id&&open_(o)).length;
      return ask(`Видалити категорію «${c.n}» з сайту?${n?` Незакриті замовлення (${n}) залишаться в CRM.`:''}`,()=>{ ORDER.splice(ORDER.indexOf(id),1); c.deleted=1; U.scat=ORDER.find(k=>CATS[k].kind!=='form'); }); }
    case 'sAddSize': sizes().push(c.kind==='stand'?[800,2000,0]:[1000,1000]); break;
    case 'sDelSize': return ask('Видалити розмір?',()=>{ sizes().splice(i,1); });
    case 'sAddMat': c.mats.push(c.kind==='sheet'?{n:'Новий матеріал',t:'',sheet:[200,300],cost:0,pr:{}}:{n:'Новий матеріал',t:'',rolls:[160],cost:0,pr:{}}); break;
    case 'sDelMat': return ask(`Видалити матеріал «${c.mats[i].n}»?`,()=>{ c.mats.splice(i,1); });
    case 'sAddRoll': c.mats[i].rolls.push(Math.max(...c.mats[i].rolls)+50); break;
    case 'sDelRoll': c.mats[i].rolls.splice(j,1); break;
    case 'sAddQ': { const k='q'+Date.now().toString(36); Q[k]={n:'Нова якість',t:''}; INK[k]=0; break; }
    case 'sDelQ': { const k=d.k, used=ORDER.filter(id=>CATS[id].q&&CATS[id].q.includes(k)).map(id=>CATS[id].n);
      return ask(`Видалити якість «${plain(Q[k].n)}»?${used.length?` Її буде прибрано з категорій: ${used.join(', ')} — і ціни матеріалів для неї теж.`:''}`,()=>{
        for(const id of Object.keys(CATS)){ const C=CATS[id]; if(C.q) C.q=C.q.filter(x=>x!==k); (C.mats||[]).forEach(m=>{ if(m.pr) delete m.pr[k]; }); }
        delete Q[k]; delete INK[k]; }); }
    case 'sAddVar': OPT[d.key].c.push({l:'Новий варіант',p:0,per:'piece'}); break;
    case 'sDelVar': OPT[d.key].c.splice(i,1); break;
    case 'sAddOpt': { const key='o'+Date.now().toString(36); OPT[key]={id:key,l:'Нова опція',t:'select',c:[{l:'Ні'},{l:'Так',p:0,per:'piece'}]}; (c.opts=c.opts||[]).push(key); break; }
    case 'sDelOpt': return ask(`Прибрати опцію «${OPT[d.key].l}» з категорії «${c.n}»?`,()=>{ c.opts=c.opts.filter(k=>k!==d.key); });
    case 'sAddTerm': TERMS[d.g].push({id:'t'+Date.now().toString(36),n:'Новий термін',s:'',days:1,k:1}); break;
    case 'sDelTerm': TERMS[d.g].splice(i,1); break;
    case 'sAddVol': CFG.volume.push({q:(CFG.volume.at(-1).q||1)*2,d:0}); break;
    case 'sDelVol': CFG.volume.splice(i,1); break;
    case 'sAddMach': CFG.machines.push({id:'m'+Date.now().toString(36),n:'Нова машина'}); break;
    case 'sDelMach': { const m=CFG.machines[i], n=ORD.filter(o=>o.mach===m.id&&o.st==='print').length; return ask(`Видалити машину «${m.n}»?${n?` ${n} замовл. у друці повернуться в чергу.`:''}`,()=>{ ORD.forEach(o=>{ if(o.mach===m.id&&o.st==='print'){ o.st='paid'; o.mach=null; } }); CFG.machines.splice(i,1); }); }
    case 'sAddCc': CFG.ccats.push({id:'cc'+Date.now().toString(36),n:'Нова категорія',k:1}); break;
    case 'sDelCc': { const x=CFG.ccats[i], n=CL.filter(c=>c.cat===x.id).length; return ask(`Видалити категорію «${x.n}»?${n?` ${n} клієнт(ів) перейдуть у «${CFG.ccats[0].n}».`:''}`,()=>{ CL.forEach(c=>{ if(c.cat===x.id) c.cat=CFG.ccats[0].id; }); CFG.ccats.splice(i,1); }); }
    case 'sAddLvl': CFG.levels.push({id:'l'+Date.now().toString(36),name:'Новий рівень',d:0}); break;
    case 'sDelLvl': { const l=CFG.levels[i], rest=CFG.levels.filter((x,k)=>k!==i), n=CL.filter(c=>c.level===l.id).length;
      return ask(`Видалити рівень «${l.name}»?${n?` ${n} клієнт(ів) буде переведено на «${rest[0].name}».`:''}`,()=>{ CL.forEach(c=>{ if(c.level===l.id) c.level=rest[0].id; }); CFG.levels.splice(i,1); }); }
    case 'sAddText': TEXTS.push({t:'Новий розділ',where:'info',body:'',photos:[]}); break;
    case 'sDelText': return ask(`Видалити розділ «${TEXTS[i].t}»?`,()=>{ TEXTS.splice(i,1); });
    case 'sDelPh': TEXTS[i].photos.splice(j,1); break;
    case 'sMovePh': { const p=TEXTS[i].photos, k=j+(+d.v); [p[j],p[k]]=[p[k],p[j]]; break; }
    default: return false;
  }
  LCACHE.clear(); rr(); return true;
}
function settingsChange(t){
  const d=t.dataset, s=d.s; if(!s) return false;
  const i=d.i!=null?+d.i:null, j=d.j!=null?+d.j:null, c=CATS[U.scat], v=t.value, n=+v;
  const m=i!=null&&c.mats?c.mats[i]:null, ch=d.key&&i!=null?OPT[d.key].c[i]:null;
  const sizes=()=>c.kind==='stand'?c.vids[Math.min(U.svid||0,c.vids.length-1)].sizes:c.std;
  let redraw=false;
  switch(s){
    case 'cn': c.n=v; break; case 'cd': c.d=v; break; case 'cterms': c.terms=v; break; case 'cshow': c.hidden=!t.checked; break;
    case 'cq': if(t.checked){ if(!c.q.includes(d.k)) c.q.push(d.k); } else c.q=c.q.filter(k=>k!==d.k); break;
    case 'szw': sizes()[i][0]=n; break; case 'szh': sizes()[i][1]=n; break; case 'szp': sizes()[i][2]=n; break;
    case 'szn': { const r=sizes()[i]; if(c.kind==='stand') r[3]=v; else r[2]=v; break; }
    case 'mn': m.n=v; break; case 'mt': m.t=v; break; case 'mna': m.na=t.checked?0:1; redraw=true; break;
    case 'mroll': if(n>0){ const old=m.rolls[j]; m.rolls[j]=n/10; if(m.pw&&m.pw[old]){ m.pw[n/10]=m.pw[old]; delete m.pw[old]; } } break;
    case 'mpw': { m.pw=m.pw||{}; const W=m.rolls[j], r=m.pw[W]=m.pw[W]||[]; r[+d.x]=v===''?null:n/10; break; } case 'msw': if(n>0) m.sheet[0]=n/10; break; case 'msh': if(n>0) m.sheet[1]=n/10; break;
    case 'mmargin': if(v==='') delete m.margin; else m.margin=n/10; break; case 'mcost': m.cost=n||0; break;
    case 'mpr': if(v==='') delete m.pr[d.k]; else m.pr[d.k]=n; break;
    case 'mwaste': if(v==='') delete m.waste; else m.waste=n; break;
    case 'mfx': { m.fx=m.fx||{}; const z=m.fx[d.z]=m.fx[d.z]||{}; if(v==='') delete z[d.k]; else z[d.k]=n; break; }
    case 'glenAdd': CFG.lenAdd=(n||0)/10; break; case 'gseam': CFG.seam=n||0; break; case 'gnest': CFG.nest=t.checked; break;
    case 'qcat': { const C=CATS[d.cat]; if(t.checked){ if(!C.q.includes(d.k)) C.q.push(d.k); } else { C.q=C.q.filter(x=>x!==d.k); } redraw=true; break; }
    case 'qn': Q[d.k].n=v; break; case 'qt': Q[d.k].t=v; break; case 'qink': INK[d.k]=n||0; break;
    case 'otitle': OPT[d.key].l=v; break; case 'otype': OPT[d.key].t=v; break;
    case 'ol': ch.l=v; break; case 'op': setPrice(ch,unitOf(ch),v); break; case 'ou': setPrice(ch,v,priceOf(ch)); redraw=true; break;
    case 'omin': if(v==='') delete ch.min; else ch.min=n; break;
    case 'ostep': if(n>0) ch.step=n/10; break; case 'oholes': if(n>0) ch.holes=n; break;
    case 'tn': TERMS[d.g][i].n=v; break; case 'ts': TERMS[d.g][i].s=v; break; case 'tk': TERMS[d.g][i].k=n||1; break;
    case 'tv': case 'tu': { const tm=TERMS[d.g][i], u=s==='tu'?v:(tm.hours?'h':'d'), val=s==='tv'?n:(tm.hours||tm.days); delete tm.hours; delete tm.days; tm[u==='h'?'hours':'days']=val||1; break; }
    case 'vq': CFG.volume[i].q=n; break; case 'vd': CFG.volume[i].d=(n||0)/100; break;
    case 'gmarkup': CFG.markup=(n||0)/100; break; case 'gmarginRoll': CFG.marginRoll=(n||0)/10; break; case 'gmarginSheet': CFG.marginSheet=(n||0)/10; break; case 'gleftoverMin': CFG.leftoverMin=(n||0)/10; break;
    case 'gpvhBase': CFG.pvhCut.base=n||0; break; case 'gpvhMm': CFG.pvhCut.perMm=n||0; break;
    case 'machN': CFG.machines[i].n=v; break; case 'ccn': CFG.ccats[i].n=v; break; case 'cck': if(n>0) CFG.ccats[i].k=n/100; break;
    case 'rOn': CFG.remind.on=t.checked; redraw=true; break; case 'rDay': CFG.remind.onDay=t.checked; redraw=true; break; case 'rOver': CFG.remind.overdue=t.checked; redraw=true; break; case 'rEvery': CFG.remind.every=Math.max(0,n||0); redraw=true; break;
    case 'mAuto': CFG.msg.auto=t.checked; break; case 'mOn': CFG.msg[d.k].on=t.checked; break; case 'mV': CFG.msg[d.k].v=v; break;
    case 'pmax': CFG.printMax[d.k]=Math.max(0,n||0); break; case 'govl': CFG.overlap=Math.max(0,n||0); break;
    case 'ln': CFG.levels[i].name=v; break; case 'ld': CFG.levels[i].d=(n||0)/100; break;
    case 'xt': TEXTS[i].t=v; break; case 'xw': TEXTS[i].where=v; break; case 'xb': TEXTS[i].body=v; break; case 'xcap': TEXTS[i].photos[j].cap=v; break;
    case 'xadd': for(const f of t.files) shrinkImg(f).then(src=>{ TEXTS[i].photos.push({src,cap:f.name.replace(/\.[^.]+$/,'')}); persist(); rr(); }); break;
    default: return false;
  }
  LCACHE.clear(); if(redraw) rr(); return true;
}

  <div class="card flush"><div class="bar"><b>Права ролей</b><span class="muted" style="font-size:13px">${own?'Позначте, що доступно кожній ролі. Власник завжди має повний доступ.':'Змінювати права може тільки власник.'}</span></div>
   <div class="tbl-wrap"><table class="tbl compact perm"><thead><tr><th style="min-width:230px">Право</th>${RL.map(r=>`<th>${own&&!r.fixed?`<div class="rh"><input class="ed" data-rname="${r.id}" value="${esc(r.n)}">${delBtn('delRole',`data-v="${r.id}"`,'Видалити роль')}</div>`:esc(r.n)}<small class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">${cnt(r.id)} співроб.</small></th>`).join('')}</tr></thead><tbody>
    ${PERMS.map(([k,n,h])=>`<tr><td>${n}${h?`<small>${h}</small>`:''}</td>${RL.map(r=>`<td><input type="checkbox" data-perm="${k}" data-role-id="${r.id}" ${r.fixed||r.perms.includes(k)?'checked':''} ${!own||r.fixed?'disabled':''} aria-label="${esc(r.n)}: ${n}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>
   ${own?`<div class="bar" style="border-top:1px solid var(--line);border-bottom:0"><button class="btn sm" data-act="addRole">+ Роль</button><span class="muted" style="font-size:12.5px">Нова роль створюється без прав — позначте потрібні.</span></div>`:''}</div>`;
}

/* =====================================================================
   МАРШРУТИ, ДІЇ
   ===================================================================== */
const PAGES={reports:pReports,dash:pDash,orders:pOrders,order:pOrder,prepress:pPrepress,production:pProduction,clients:pClients,client:pClient,money:pMoney,settings:pSettings,staff:pStaff};
function go(id){ try{ history.pushState(null,'','#'+id); }catch(e){} route(id); }
function route(id){
  if(id==null) id=location.hash.slice(1)||'dash';
  const [pg,arg]=id.split('/'); U.page=PAGES[pg]?pg:'dash'; U.arg=arg;
  if(!['orders','clients','reports','prepress'].includes(U.page)) U.q='';
  closeModal(); render(); window.scrollTo(0,0);
}
function render(){ renderWho(); if(ME()&&!seesOrders()&&['dash','orders'].includes(U.page)){ U.page='production'; try{ history.replaceState(null,'','#production'); }catch(e){} } document.querySelector('.alay').classList.toggle('solo',!ME()); if(!ME()){ $('#side').innerHTML=''; $('#side').style.display='none'; pLogin(); return; } $('#side').style.display=''; renderSide(); PAGES[U.page](U.arg); }
function rr(){ const y=window.scrollY; render(); window.scrollTo(0,y); }
window.addEventListener('popstate',()=>route());

function modal(html){ $('#modalBox').innerHTML=html+`<div style="text-align:right;margin-top:18px"><button class="btn" data-close>Закрити</button></div>`; $('#modal').classList.add('on'); }
function closeModal(){ $('#modal').classList.remove('on'); }
const toast=t=>modal(`<h3>${t}</h3>`);

function setStatus(o,s){
  if(!NEXT[o.st].includes(s)) return;
  const from=o.st; o.st=s; logO(o,`статус «${ST[from][0]}» → «${ST[s][0]}»`);
  if(s==='paid'&&!o.qAt){ o.qAt=new Date(); logO(o,`агент друку: створено папку ${diskDir(o,PRINT_ROOT)}`); }
  const msg={print:'Замовлення передано в друк.',ready:o.deliv==='self'?'Замовлення готове. Забрати можна на складі.':'Замовлення готове й буде відправлене Новою Поштою.',sent:`Замовлення відправлено. ТТН ${o.ttn}.`,cancel:'Замовлення скасовано.',paid:o.credit&&!isPaid(o)?`Макет перевірено, замовлення в черзі на друк. Оплату очікуємо до ${dstr(o.credit.date)}.`:'Макет перевірено, оплату отримано — замовлення в черзі на друк.'}[s];
  if(msg) sendClient(o,s==='ready'||s==='sent'?'Склад':'Менеджер',`№${o.id}: ${msg}`);
}
function payFromBalance(o){ const s=due(o); if(s<=0||bal(o.c)<s) return;
  LEDGER.push({c:o.c,d:new Date(),t:`Оплата замовлення №${o.id}`,s:-s}); o.paid+=s; logO(o,`оплата з балансу ${fmt(s)} грн`);
  sendClient(o,'Бухгалтерія',`Оплату ${fmt(s)} грн за №${o.id} отримано.`);
  if(o.st==='check'&&layoutsOk(o)) setStatus(o,'paid'); }
// оплата поза балансом (переказ, готівка, термінал) — тільки бухгалтер
function markPaid(o){ const s=due(o); if(s<=0) return; LEDGER.push({c:o.c,d:new Date(),t:`Надходження оплати за №${o.id}`,s}); INV.forEach(v=>{ if(v.o.includes(o.id)) v.paid=true; }); payFromBalance(o); }
function unpay(o){ const s=o.paid; if(!s) return; LEDGER.push({c:o.c,d:new Date(),t:`Повернення оплати №${o.id} (статус змінено бухгалтером)`,s},{c:o.c,d:new Date(),t:`Сторно надходження за №${o.id}`,s:-s}); o.paid=0; INV.forEach(v=>{ if(v.o.includes(o.id)) v.paid=false; }); logO(o,'статус оплати: не оплачено'); }
function releaseOrders(s){ for(const o of ORD) if(o.who===s.id&&open_(o)){ o.who=null; o.log.push({d:new Date(),t:`${short(s.n)} пішов зі зміни — замовлення вільне`}); } }

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-close]')||t.id==='modal'){ closeModal(); return; }
  const ts=t.closest('[data-toast]'); if(ts){ toast(ts.dataset.toast); return; }
  const g=t.closest('[data-go]'); if(g&&!t.closest('[data-act]')){ e.preventDefault(); if(g.dataset.own) U.own=g.dataset.own; go(g.dataset.go); return; }
  const a=t.closest('[data-act]'); if(!a||a.disabled) return;
  if(settingsClick(a)) return;
  const v=a.dataset.v, id=a.dataset.id?+a.dataset.id:null, o=id?ord(id):null;
  switch(a.dataset.act){
    case 'fill': { const s=STAFF.find(x=>x.id===id); $('#lgLogin').value=s.login; $('#lgPass').value=s.pass; return; }
    case 'login': { const l=$('#lgLogin').value.trim().toLowerCase(), p=$('#lgPass').value, s=STAFF.find(x=>x.login===l&&x.pass===p);
      if(!s){ $('#lgErr').textContent='Невірний email або пароль'; return; }
      setMe(s.id); s.online=true; s.seen=new Date(); go(seesOrders()?'dash':'production'); break; }
    case 'logout': { const s=ME(); if(s){ s.online=false; s.seen=new Date(); releaseOrders(s); } setMe(null); render(); break; }
    case 'fClear': Object.assign(U,{df:'',dt:'',q:'',fMgr:'',fDes:'',fRv:'',fPay:'',fSum:'',fPd:'',fSt:''}); rr(); break;
    case 'repCsv': reportCsv(); break;
    case 'period': U.period=+v; rr(); break;
    case 'otab': U.otab=v; rr(); break;
    case 'own': U.own=v; rr(); break;
    case 'take': o.who=meId; logO(o,'взяв(ла) в роботу'); if(U.page==='order') rr(); else go('order/'+id); break;
    case 'shift': { const s=STAFF.find(x=>x.id===id); s.online=!s.online; s.seen=new Date(); if(!s.online) releaseOrders(s); rr(); break; }
    case 'st': if(v==='cancel'){ modal(`<h3>Скасувати №${id}?</h3><p class="muted">Клієнт отримає повідомлення.${o.paid?` Оплачені ${fmt(o.paid)} грн повернуться на баланс клієнта.`:''}</p><button class="btn pri" data-act="doCancel" data-id="${id}">Так, скасувати</button>`); break; }
      setStatus(o,v); rr(); break;
    case 'doCancel': if(o.paid){ LEDGER.push({c:o.c,d:new Date(),t:`Повернення за скасоване №${o.id}`,s:o.paid}); o.paid=0; } setStatus(o,'cancel'); closeModal(); rr(); break;
    case 'fOk': { const f=o.files[+v]; f.st='ok'; logO(o,`макет ${f.n} перевірено`);
      if(layoutsOk(o)){ if(o.st==='fix') o.st='check'; sendClient(o,'Препрес',`Макет для №${o.id} перевірено.`+(isPaid(o)?' Замовлення йде в друк.':' Замовлення піде в друк після оплати.')); o.rv='ok'; if((isPaid(o)||o.credit)&&o.st==='check') setStatus(o,'paid'); }
      rr(); break; }
    case 'fBad': modal(`<h3>Повернути макет на виправлення</h3><p class="muted" style="margin-top:0">${esc(o.files[+v].n)} · №${id}</p>
       <div class="lbl">Причина (клієнт побачить цей текст)</div><textarea class="area" id="badWhy" style="min-height:90px" placeholder="Напр.: шрифти не переведені в криві"></textarea>
       <label class="check" style="margin-top:10px;font-size:13px"><input type="checkbox" id="badRw" checked>Додати в повідомлення посилання «Замовити доопрацювання»</label>
       <div style="margin-top:12px"><button class="btn pri" data-act="doBad" data-id="${id}" data-v="${v}">Повернути клієнту</button></div>`); break;
    case 'doBad': { const why=$('#badWhy').value.trim(); if(!why){ $('#badWhy').focus(); return; } const f=o.files[+v]; f.st='bad'; f.reason=why; o.fixReason=why; o.rv='bad';
      if(o.st==='check') o.st='fix'; logO(o,`макет ${f.n} повернено: ${why}`);
      sendClient(o,'Препрес',`Макет ${f.n} повернено на виправлення. ${why}`,{fix:$('#badRw').checked});
      closeModal(); rr(); break; }
    case 'rwSet': { const inp=$('#rwP')||$('#rwP'+id); const p=+inp.value; if(!(p>0)){ inp.focus(); return; }
      o.rework=p; o.reworkReq=false; logO(o,`вартість доопрацювання ${fmt(p)} грн`); sendClient(o,'Препрес',`Вартість доопрацювання макета: ${fmt(p)} грн — додано до замовлення №${o.id}. Після оплати дизайнер підготує макет.`); rr(); break; }
    case 'reply': { const tx=$('#rTx').value.trim(); if(!tx) return; sendClient(o,$('#rFrom').value,tx); logO(o,'надіслано повідомлення клієнту'); rr(); break; }
    case 'ttn': { const t2=$('#ttn').value.trim(); for(const x of o.dg?ORD.filter(y=>y.dg===o.dg):[o]){ x.ttn=t2; logO(x,`ТТН ${t2||'видалено'}${o.dg?' (спільна відправка '+o.dg+')':''}`); } rr(); break; }
    case 'dgDo': { const ids=[...document.querySelectorAll('.dg:checked')].map(x=>+x.value), S0=Math.max(0,+$('#dgS').value||0), m=$('#dgM').value;
      if(ids.length<2){ toast('Позначте щонайменше два замовлення.'); return; } if(!S0){ $('#dgS').focus(); return; }
      const os=ids.map(ord), tot=os.reduce((a,x)=>a+x.sum+x.rework,0), gid='В-'+String(Date.now()).slice(-5); let left=S0;
      os.forEach((x,i)=>{ const share=i===os.length-1?left:Math.round((m==='eq'?S0/os.length:m==='first'?(i?0:S0):S0*(x.sum+x.rework)/tot)*100)/100; left=Math.round((left-share)*100)/100;
        x.dlv=share; x.dg=gid; logO(x,`спільна відправка ${gid} (${os.map(y=>'№'+y.id).join(', ')}): доставка ${fmt(share)} грн`); sendClient(x,'Доставка',`Замовлення ${os.map(y=>'№'+y.id).join(', ')} буде відправлено однією посилкою. Доставка ${fmt(S0)} грн, для №${x.id} — ${fmt(share)} грн.`); });
      INV.forEach(v=>{ if(!v.paid&&v.o.some(i=>ids.includes(i))) v.s=v.o.reduce((a,i)=>a+(ord(i)?due(ord(i)):0),0); }); rr(); break; }
    case 'payBal': if(!can('pay')) return; payFromBalance(o); rr(); break;
    case 'markPaid': if(!can('pay')) return; markPaid(o); rr(); break;
    case 'unpay': if(!can('pay')) return; ask(`Позначити №${id} як не оплачене? Оплачені ${fmt(o.paid)} грн буде сторновано.`,()=>{ unpay(o); }); $('#modalBox .btn.pri').textContent='Так, не оплачено'; break;
    case 'credit': if(!can('credit')) return; creditModal(o); break;
    case 'doCredit': { const v2=$('#crDate').value; if(!v2){ $('#crErr').textContent='Вкажіть дату оплати'; return; }
      const d=new Date(v2+'T00:00:00'); if(dayKey(d)<0){ $('#crErr').textContent='Дата оплати не може бути в минулому'; return; }
      const note=$('#crNote').value.trim(); o.credit={date:d,by:meId,note}; logO(o,`у друк без оплати, дата оплати ${dstr(d)}${note?' — '+note:''}`);
      sendClient(o,'Менеджер',`Замовлення №${o.id} передано в друк до оплати. Будь ласка, оплатіть ${fmt(due(o))} грн до ${dstr(d)}.`);
      if(o.st==='check') setStatus(o,'paid'); closeModal(); rr(); break; }
    case 'dlvSet': { if(!can('delivery')) return; const p=Math.max(0,+$('#dlvP').value||0); o.dlv=p; logO(o,p?`доставка ${fmt(p)} грн`:'доставку прибрано');
      INV.forEach(x=>{ if(!x.paid&&x.o.includes(o.id)) x.s=x.o.reduce((a,oid)=>a+(ord(oid)?due(ord(oid)):0),0); });
      if(p) sendClient(o,'Доставка',`До замовлення №${o.id} додано доставку: ${fmt(p)} грн. До сплати разом: ${fmt(due(o))} грн.`); rr(); break; }
    case 'sendInv': { const inv=INV[+v], c=cl(inv.c), ph=(c.ph||'').replace(/\D/g,''), tx=encodeURIComponent(`Рахунок ${inv.n} на ${fmt(inv.s)} грн${inv.o.length?' за замовлення №'+inv.o.join(', №'):''}`);
      const ch=(n,href,sub)=>`<a class="btn sendch" href="${href}" target="_blank" rel="noopener" data-act="invSent" data-v="${v}" data-ch="${n}"><b>${n}</b><span>${esc(sub)}</span></a>`;
      modal(`<h3>Надіслати рахунок ${inv.n}</h3><p class="muted" style="margin-top:0">${esc(c.n)} · ${fmt(inv.s)} грн. Контакти — з картки клієнта.</p>
        <div class="btns" style="margin-bottom:10px"><button class="btn pri" data-act="invAuto" data-v="${v}">Надіслати PDF усіма каналами</button><button class="btn" data-act="invDoc" data-v="${v}">Переглянути рахунок</button></div>
        <div class="lbl">Або вручну</div><div class="sendgrid">
        ${ch('Email',`mailto:${c.em}?subject=${tx}&body=${tx}`,c.em)}${ch('Telegram',`https://t.me/+${ph}`,c.ph)}${ch('WhatsApp',`https://wa.me/${ph}?text=${tx}`,c.ph)}${ch('Viber',`viber://chat?number=%2B${ph}`,c.ph)}</div>
        <p class="muted" style="font-size:12.5px">Канали й бізнес-акаунти — у «Налаштування → CRM і виробництво».</p>`); break; }
    case 'invSent': { const inv=INV[+v]; (inv.sent=inv.sent||[]).push({ch:a.dataset.ch,d:new Date(),by:meId}); inv.o.forEach(oid=>{ const x=ord(oid); if(x){ logO(x,`рахунок ${inv.n} надіслано: ${a.dataset.ch}`); sendClient(x,'Бухгалтерія',`Рахунок ${inv.n} на ${fmt(inv.s)} грн надіслано (${a.dataset.ch}).`); } }); setTimeout(()=>{ closeModal(); rr(); },50); break; }
    case 'oview': U.oview=v; rr(); break;
    case 'combo': U.combo=!U.combo; rr(); break;
    case 'nmTgl': U.nm=a.checked; rr(); break;
    case 'printDoc': printDoc(o); break;
    // відкриття файлу / папки робить агент друку через своє посилання drukagent:// (браузер сам не має доступу до диска)
    case 'fsOpen': case 'fsReveal': fsModal(a.dataset.act==='fsOpen',v); break;
    case 'fsOpenO': { const fs=o.files.map((f,i)=>({f,i})).filter(x=>x.f.st==='ok'), dir=diskDir(o,PRINT_ROOT), path=x=>dir+'\\'+diskName(o,x.f,x.i);
      if(fs.length===1){ fsModal(true,path(fs[0])); break; }
      modal(`<h3>Файли замовлення №${o.id}</h3><div style="display:grid;gap:8px">${fs.map(x=>`<div class="disk-f"><span>${esc(diskName(o,x.f,x.i))}</span><span class="disk-a"><button class="btn sm pri" data-act="fsOpen" data-v="${esc(path(x))}">Відкрити</button><button class="btn sm" data-act="fsReveal" data-v="${esc(path(x))}">Показати в папці</button></span></div>`).join('')}</div>`); break; }
    case 'fsCopy': { const path=v; const ok=()=>{ a.textContent='Скопійовано ✓'; setTimeout(()=>{ a.textContent='Копіювати шлях'; },1500); };
      try{ navigator.clipboard.writeText(path).then(ok,()=>toast(esc(path))); }catch(e){ toast(esc(path)); } return; }
    case 'demoEdit': { const i=o.files.findIndex(f=>f.st==='ok'); if(i<0) return; const f=o.files[i], who=can('production')&&!can('prepress')?'на ПК друкаря':'на ПК дизайнера';
      f.ver=(f.ver||1)+1; f.at=new Date(); f.by=who; logO(o,`файл ${diskName(o,f,i)} змінено ${who} — замінено на сервері (версія ${f.ver}, стару видалено)`); rr(); break; }
    case 'prIssue': modal(`<h3>Повернути №${id} менеджеру</h3><p class="muted" style="margin-top:0">Замовлення вийде з черги друку. Менеджер вирішить, чи передавати клієнту.</p><div class="lbl">Що не так (критично для друку)</div><textarea class="area" id="prT" style="min-height:90px" placeholder="Напр.: немає вильотів 5 мм, текст у зоні люверсів"></textarea><div style="margin-top:12px"><button class="btn pri" data-act="doPrIssue" data-id="${id}">Повернути</button></div>`); break;
    case 'doPrIssue': { const t=$('#prT').value.trim(); if(!t){ $('#prT').focus(); return; } o.prIssue={t,by:meId,d:new Date()}; o.st='check'; o.mach=null; logO(o,`друкар повернув менеджеру: ${t}`); closeModal(); rr(); break; }
    case 'prToClient': { const t=o.prIssue.t; o.files.forEach(f=>{ if(f.st==='ok'){ f.st='bad'; f.reason=t; } }); o.fixReason=t; o.st='fix'; o.rv='bad'; delete o.prIssue; logO(o,'зауваження друкаря передано клієнту');
      sendClient(o,'Препрес',`Макет для №${o.id} потребує виправлення перед друком: ${t}`,{fix:true}); rr(); break; }
    case 'prResolve': delete o.prIssue; o.st='paid'; logO(o,'зауваження друкаря вирішено, замовлення повернуто в чергу'); rr(); break;
    case 'addClient': modal(`<h3>Новий клієнт</h3><div class="fgrid"><div><div class="lbl">Ім’я та прізвище</div><input class="inp" id="ncN"></div><div><div class="lbl">Телефон</div><input class="inp" id="ncP" placeholder="+380 …"></div>
       <div><div class="lbl">Email</div><input class="inp" id="ncE" type="email"></div><div><div class="lbl">Тип</div><select class="sel" id="ncT"><option value="person">Фізична особа</option><option value="fop">ФОП</option><option value="company">Юридична особа</option></select></div>
       <div><div class="lbl">Категорія (ціни)</div><select class="sel" id="ncC">${CFG.ccats.map(x=>`<option value="${x.id}">${esc(x.n)}</option>`).join('')}</select></div><div><div class="lbl">Компанія / реквізити</div><input class="inp" id="ncCo"></div></div>
       <div id="ncErr" style="color:var(--bad);font-size:13px;min-height:18px;margin-top:6px"></div><p class="muted" style="font-size:13px;margin-top:0">Для клієнта створюється особистий кабінет: доступ прийде на телефон або email (у робочій версії).</p><button class="btn pri" data-act="doClient">Створити клієнта</button>`); break;
    case 'doClient': { const n=$('#ncN').value.trim(), ph=$('#ncP').value.trim(), em=$('#ncE').value.trim().toLowerCase();
      if(!n||(!ph&&!em)){ $('#ncErr').textContent='Вкажіть ім’я і телефон або email'; return; }
      const nid=Math.max(...CL.map(c=>c.id))+1; CL.push({id:nid,n,ph:ph||'—',em:em||'—',type:$('#ncT').value,co:$('#ncCo').value.trim(),cat:$('#ncC').value,level:CFG.levels[0].id,since:new Date(),pass:'k'+Math.random().toString(36).slice(2,8),by:meId});
      closeModal(); go('client/'+nid); break; }
    case 'behalf': { const ds=debtsOf(id);
      if(ds.length){ modal(`<div class="alert" style="margin:0 0 12px"><b>У клієнта є борг: ${fmt(ds.reduce((a,o)=>a+due(o),0))} грн</b>${ds.map(o=>`№${o.id} — ${fmt(due(o))} грн, дата оплати ${dstr(o.credit.date)}${dayKey(o.credit.date)<0?' (прострочено)':''}`).join('<br>')}</div>
        <p style="margin:0 0 12px">Продовжити оформлення нового замовлення?</p><div class="btns"><button class="btn" data-close>Скасувати</button><button class="btn pri" data-act="doBehalf" data-id="${id}">Продовжити</button></div>`); break; }
      } // без боргу — одразу далі
    case 'doBehalf': closeModal(); persist(); window.open(`calculator.html?as=${id}&by=${meId}`,'_blank'); break;
    case 'catOk': { const c=cl(id); c.cat=c.catReq; delete c.catReq; rr(); break; }
    case 'catNo': { const c=cl(id); delete c.catReq; rr(); break; }
    case 'demoUp': addFile(o,'maket_vypravlenyi.pdf'); rr(); break;
    case 'mkInv': { const n='СФ-'+(3122+INV.length), inv={n,c:o.c,d:new Date(),o:[o.id],s:due(o),paid:false}; INV.unshift(inv); logO(o,`виставлено рахунок ${n}`); sendClient(o,'Бухгалтерія',`Рахунок ${n} на ${fmt(due(o))} грн — у розділі «Фінанси».`);
      const ch=CFG.msg&&CFG.msg.auto?autoSend(inv):[]; toast(`Рахунок ${n} виставлено${ch.length?' і надіслано: '+ch.join(', '):''}`); rr(); break; }
    case 'invAuto': { const ch=autoSend(INV[+v]); toast(ch.length?`Рахунок ${INV[+v].n} надіслано: ${ch.join(', ')}`:'Немає увімкнених каналів або контактів клієнта.'); rr(); break; }
    case 'invDoc': invDoc(INV[+v]); break;
    case 'invPaid': { if(!can('pay')) return; const inv=INV[+v]; inv.paid=true; LEDGER.push({c:inv.c,d:new Date(),t:`Оплата за рахунком ${inv.n}`,s:inv.s});
      for(const oid of inv.o){ const x=ord(oid); if(x) payFromBalance(x); } rr(); break; }
    case 'adj': modal(`<h3>Коригування балансу · №${id}</h3><div class="fgrid"><div><div class="lbl">Сума, грн (мінус — списання)</div><input class="inp" id="adjS" type="number"></div><div><div class="lbl">Коментар</div><input class="inp" id="adjT" placeholder="Причина"></div></div><div style="margin-top:12px"><button class="btn pri" data-act="doAdj" data-id="${id}">Провести</button></div>`); break;
    case 'doAdj': { if(!can('pay')) return; const s=+$('#adjS').value, tx=$('#adjT').value.trim(); if(!s||!tx) return; LEDGER.push({c:id,d:new Date(),t:`Коригування (${short(ME().n)}): ${tx}`,s}); closeModal(); rr(); break; }
    case 'addRole': if(!isOwner()) return; RL.push({id:'r'+Date.now().toString(36),n:'Нова роль',perms:[]}); syncRoles(); rr(); break;
    case 'delRole': { if(!isOwner()) return; const r=roleOf(v), others=RL.filter(x=>!x.fixed&&x.id!==v).sort((a,b)=>a.perms.length-b.perms.length), n=STAFF.filter(x=>x.role===v).length; // переводимо на роль з найменшими правами
      if(!others.length){ toast('Має лишитися хоча б одна роль, крім «Власник».'); return; }
      ask(`Видалити роль «${r.n}»?${n?` ${n} співроб. буде переведено на роль «${others[0].n}».`:''}`,()=>{ STAFF.forEach(x=>{ if(x.role===v) x.role=others[0].id; }); RL=RL.filter(x=>x.id!==v); syncRoles(); }); break; }
    case 'delStaff': { const st=STAFF.find(x=>x.id===id); ask(`Видалити співробітника «${st.n}»? Його незакриті замовлення стануть вільними.`,()=>{ releaseOrders(st); STAFF.splice(STAFF.indexOf(st),1); }); break; }
    case 'delClient': { const cc=cl(id), n=ORD.filter(o=>o.c===id&&open_(o)).length;
      ask(`Видалити клієнта «${cc.n}» (№${id})?${n?` У нього ${n} незакритих замовлень — вони залишаться в CRM.`:''}`,()=>{ CL.splice(CL.indexOf(cc),1); go('clients'); }); break; }
    case 'delInv': { const inv=INV[+v]; ask(`Видалити рахунок ${inv.n}?`,()=>{ INV.splice(+v,1); }); break; }
    case 'addStaff': modal(`<h3>Новий співробітник</h3><div class="fgrid"><div><div class="lbl">Ім’я та прізвище</div><input class="inp" id="sfN"></div><div><div class="lbl">Роль</div><select class="sel" id="sfR" ${isOwner()?'':'disabled title="Роль призначає власник"'}>${RL.filter(r=>!r.fixed).map(r=>`<option value="${r.id}" ${r.id==='manager'?'selected':''}>${esc(r.n)}</option>`).join('')}</select></div>
       <div class="full"><div class="lbl">Email для входу</div><input class="inp" id="sfE" type="email" placeholder="name@example.com"></div></div><p class="muted" style="font-size:13px">Запрошення з посиланням для встановлення пароля прийде на email (у робочій версії).</p><button class="btn pri" data-act="doStaff">Додати</button>`); break;
    case 'doStaff': { const n=$('#sfN').value.trim(); if(!n) return; STAFF.push({id:Math.max(...STAFF.map(s=>s.id))+1,login:($('#sfE').value.trim().toLowerCase()||'new'+Date.now()+'@druk.test'),pass:'welcome123',n,role:$('#sfR').value,online:false,seen:new Date()}); closeModal(); rr(); break; }
  }
});
document.addEventListener('change',e=>{
  const t=e.target, d=t.dataset;
  if(t.id==='asg'){ const o=ord(U.arg); o.who=t.value?+t.value:null; logO(o,o.who?`призначено: ${staffN(o.who)}`:'знято виконавця'); rr(); return; }
  if(t.id==='lvl'){ const c=cl(+d.id); c.level=t.value; rr(); return; }
  if(t.id==='ccSel'){ const c=cl(+d.id); c.cat=t.value; delete c.catReq; rr(); return; }
  if(t.id==='desAsg'){ const o=ord(d.id); o.des=t.value?+t.value:null; if(o.des&&(o.rv||'none')==='none') o.rv='todo'; if(!o.des) o.rv='none'; logO(o,o.des?`перевірку призначено: ${staffN(o.des)}`:'дизайнера знято'); rr(); return; }
  if(t.id==='rvSel'){ const o=ord(d.id); o.rv=t.value; logO(o,`статус перевірки: ${RV[o.rv][0]}`); rr(); return; }
  if(d.f){ U[d.f]=t.value; rr(); return; }
  if(d.mv){ const o=ord(d.mv); moveProd(o,t.value); rr(); return; }
  if(t.id==='fDf'){ U.df=t.value; rr(); return; }
  if(t.id==='fDt'){ U.dt=t.value; rr(); return; }
  if(t.id==='fSt'){ U.rst=t.value; rr(); return; }
  if(d.role){ if(!isOwner()) return; STAFF.find(s=>s.id===+d.role).role=t.value; rr(); return; }
  if(d.perm){ if(!isOwner()) return; const r=roleOf(d.roleId); if(r.fixed) return; r.perms=t.checked?[...new Set([...r.perms,d.perm])]:r.perms.filter(x=>x!==d.perm); rr(); return; }
  if(d.rname){ if(!isOwner()) return; const r=roleOf(d.rname); r.n=t.value.trim()||r.n; syncRoles(); rr(); return; }
  if(settingsChange(t)) return;
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='oq'||t.id==='cq'){ U.q=t.value; rr(); const n=$('#'+t.id); n.focus(); n.setSelectionRange(n.value.length,n.value.length); }
  if(t.id==='brandName') $('#brand').textContent=t.value||'Назва';
  if(t.id==='brandColor'){ document.documentElement.style.setProperty('--accent',t.value); document.documentElement.style.setProperty('--accent-2',t.value); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); if(e.key==='Enter'&&['lgLogin','lgPass'].includes(e.target.id)) document.querySelector('[data-act=login]')?.click(); });

// зберігаємо після кожної дії; зміни з сайту клієнта (інша вкладка) підхоплюємо одразу
for(const ev of ['click','change','input']) document.addEventListener(ev,()=>setTimeout(persist,0));
// перетягування карток на дошках (CRM і виробництво)
let DRAG=null;
document.addEventListener('dragstart',e=>{ const c=e.target.closest&&e.target.closest('[data-drag]'); if(!c) return; DRAG=+c.dataset.drag; c.classList.add('dragging'); try{ e.dataTransfer.setData('text/plain',String(DRAG)); e.dataTransfer.effectAllowed='move'; }catch(x){} });
document.addEventListener('dragend',()=>{ DRAG=null; document.querySelectorAll('.dragging,.over').forEach(n=>n.classList.remove('dragging','over')); });
document.addEventListener('dragover',e=>{ const col=e.target.closest&&e.target.closest('[data-drop]'); if(!col||DRAG==null) return; e.preventDefault(); document.querySelectorAll('.kcol.over').forEach(n=>n!==col&&n.classList.remove('over')); col.classList.add('over'); });
document.addEventListener('drop',e=>{ const col=e.target.closest&&e.target.closest('[data-drop]'); if(!col||DRAG==null) return; e.preventDefault(); const o=ord(DRAG), [b,k]=col.dataset.drop.split(':'); DRAG=null;
  if(!o) return; if(b==='crm') moveCrm(o,k); else moveProd(o,k); persist(); });
window.addEventListener('storage',e=>{ if(e.key===DB_KEY){ bind(); rr(); } });
route();
</script>
</body>
</html>
